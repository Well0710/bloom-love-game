<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bloom - 心动60天</title>
    <style>
/* ============================================
   Bloom V3 - 恋与深空风格美学设计
   ============================================ */

:root {
    --bg-deep: #0d0d1a;
    --bg-deep-purple: #12102b;
    --gradient-primary: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.15);
    --char-wenya: #c084fc;
    --char-xiayang: #fb923c;
    --char-sujingyi: #34d399;
    --char-luxiao: #f43f5e;
    --char-linwanqing: #60a5fa;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg-deep);
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
}

#game-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* ===== 星空背景 ===== */
.starry-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #0d0d1a 0%, #1a0a2e 50%, #12102b 100%);
    z-index: 0;
}
.stars-layer-1, .stars-layer-2, .stars-layer-3 {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 230px 80px, #fff, transparent);
    background-repeat: repeat;
    background-size: 200px 200px;
    animation: twinkle 3s ease-in-out infinite;
}
.stars-layer-2 { background-size: 300px 300px; animation: twinkle 4s ease-in-out infinite reverse; opacity: 0.5; }
.stars-layer-3 { background-size: 400px 400px; animation: twinkle 5s ease-in-out infinite; opacity: 0.3; }
@keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

/* ===== 页面容器 ===== */
.page {
    display: none;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1;
}
.page.active { display: flex; }

/* ===== 首页 ===== */
.landing-content { text-align: center; animation: fadeIn 1s ease; }
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.game-title {
    font-size: 4rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
}
.landing-subtitle { font-size: 1.2rem; color: rgba(255,255,255,0.6); letter-spacing: 0.2em; margin-bottom: 40px; }
.intro-box {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 30px 40px;
    margin-bottom: 40px;
    backdrop-filter: blur(10px);
    max-width: 400px;
}
.intro-box p { color: rgba(255,255,255,0.8); line-height: 1.8; margin-bottom: 10px; }
.menu-buttons { display: flex; flex-direction: column; gap: 15px; }
.menu-btn {
    padding: 15px 50px;
    border: none;
    border-radius: 30px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s ease;
}
.menu-btn.primary { background: var(--gradient-primary); color: #fff; }
.menu-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 0 50px rgba(168, 85, 247, 0.5); }
.menu-btn.secondary { background: var(--glass-bg); border: 1px solid var(--glass-border); color: rgba(255,255,255,0.8); }
.menu-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== MBTI入口页 ===== */
.mbti-entry-content { text-align: center; }
.page-title { font-size: 1.8rem; margin-bottom: 40px; color: rgba(255,255,255,0.9); }
.mbti-entry-buttons { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
.entry-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 25px 40px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: #fff;
}
.entry-btn:hover { background: rgba(255,255,255,0.15); transform: translateX(10px); }
.entry-icon { font-size: 2rem; margin-bottom: 10px; }
.entry-text { font-size: 1.2rem; font-weight: 500; }
.entry-hint { font-size: 0.9rem; color: rgba(255,255,255,0.5); margin-top: 5px; }
.skip-btn { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 0.9rem; text-decoration: underline; }

/* ===== MBTI选择页 ===== */
.mbti-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px; max-width: 400px; }
.mbti-grid button {
    padding: 15px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s ease;
}
.mbti-grid button:hover { background: rgba(255,255,255,0.2); }
.mbti-grid button.selected { background: var(--gradient-primary); border-color: transparent; }
.confirm-btn {
    padding: 15px 50px;
    background: var(--gradient-primary);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s ease;
}
.confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== MBTI测试页 ===== */
.test-progress { width: 100%; max-width: 400px; margin-bottom: 30px; }
.progress-text { text-align: center; color: rgba(255,255,255,0.6); margin-bottom: 10px; }
.progress-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gradient-primary); transition: width 0.3s ease; }
.question-box {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 30px;
    max-width: 500px;
    width: 100%;
    text-align: center;
}
.question-text { font-size: 1.1rem; margin-bottom: 25px; line-height: 1.6; }
.options-list { display: flex; flex-direction: column; gap: 12px; }
.option-btn {
    padding: 15px 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: #fff;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
}
.option-btn:hover { background: rgba(255,255,255,0.1); }
.option-btn.selected { background: rgba(168, 85, 247, 0.3); border-color: #a855f7; }
.test-nav { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
.nav-btn {
    padding: 12px 30px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    color: #fff;
    cursor: pointer;
}
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ===== 角色选择页 ===== */
.char-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; max-width: 800px; width: 100%; margin-bottom: 30px; }
.char-card {
    background: var(--glass-bg);
    border: 2px solid var(--glass-border);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}
.char-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--char-color); }
.char-card:hover { transform: translateY(-5px); box-shadow: 0 10px 40px rgba(0,0,0,0.3); border-color: var(--char-color); }
.char-card.selected { border-color: var(--char-color); box-shadow: 0 0 30px var(--char-glow); }
.char-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 15px;
    border: 3px solid var(--char-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    background: var(--glass-bg);
}
.char-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.char-name { font-size: 1.2rem; font-weight: 500; margin-bottom: 5px; }
.char-trait { font-size: 0.85rem; color: rgba(255,255,255,0.6); }
.char-affection-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.char-affection-fill { height: 100%; background: var(--char-color); transition: width 0.3s ease; }
.start-btn {
    padding: 18px 60px;
    background: var(--gradient-primary);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
}
.start-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== 游戏主页 ===== */
#game-main-page { justify-content: flex-start; padding-top: 80px; }
.top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 15px 20px;
    background: rgba(13, 13, 26, 0.9);
    backdrop-filter: blur(20px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
}
.day-badge { background: var(--gradient-primary); padding: 8px 16px; border-radius: 20px; font-weight: 600; }
.action-points { display: flex; gap: 8px; }
.action-point { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
.action-point.available { background: #a855f7; }
.game-main-content { width: 100%; max-width: 600px; padding: 20px; }
.section-title { font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 20px; }
.action-remain { font-size: 0.9rem; color: rgba(255,255,255,0.5); }
.activity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.activity-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 15px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
}
.activity-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.12); }
.activity-card.disabled { opacity: 0.5; cursor: not-allowed; }
.activity-icon { font-size: 2rem; margin-bottom: 10px; }
.activity-name { font-size: 1rem; font-weight: 500; margin-bottom: 5px; }
.activity-desc { font-size: 0.8rem; color: rgba(255,255,255,0.5); }
.activity-energy { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 10px; font-size: 0.75rem; }
.bottom-actions { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; }
.sleep-btn {
    padding: 12px 30px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    color: #fff;
    cursor: pointer;
}

/* ===== 对话框 ===== */
.dialogue-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: none;
    flex-direction: column;
}
.dialogue-overlay.active { display: flex; }
.scene-area {
    height: 45%;
    position: relative;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.8) 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 20px;
}
.scene-image {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-size: cover;
    background-position: center;
    opacity: 0.7;
}
/* 场景渐变背景 */
.scene-stay_home { background: linear-gradient(135deg, #2d1b4e 0%, #1a0a2e 100%); }
.scene-fitness { background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%); }
.scene-park { background: linear-gradient(135deg, #134e4a 0%, #042f2e 100%); }
.scene-dinner { background: linear-gradient(135deg, #4a1c1c 0%, #1a0a0a 100%); }
.scene-overtime { background: linear-gradient(135deg, #1e1b4b 0%, #0f0a1e 100%); }
.scene-cafe { background: linear-gradient(135deg, #3d2b1f 0%, #1a1410 100%); }

.char-portrait {
    width: 200px;
    height: 280px;
    object-fit: cover;
    border-radius: 20px;
    border: 3px solid var(--char-color, #a855f7);
    box-shadow: 0 0 40px var(--char-glow, rgba(168, 85, 247, 0.5));
    position: relative;
    z-index: 1;
}
.dialogue-content { flex: 1; padding: 20px; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; }
.scene-desc {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.8);
}
.dialogue-area { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-start; }
.speaker-avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--char-color, #a855f7);
    flex-shrink: 0;
}
.dialogue-area-right { flex: 1; }
.speaker-name { font-weight: 600; color: var(--char-color, #a855f7); margin-bottom: 5px; display: block; }
.dialogue-bubble {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 15px;
    padding: 15px;
    position: relative;
}
.dialogue-text { line-height: 1.6; min-height: 60px; }
.typing-cursor {
    animation: blink 0.8s infinite;
    color: #a855f7;
    font-weight: bold;
}
@keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
}
.choices-area { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.choice-btn {
    padding: 15px 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    color: #fff;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 1rem;
    animation: slideIn 0.3s ease forwards;
    opacity: 0;
}
.choice-btn:nth-child(1) { animation-delay: 0.1s; }
.choice-btn:nth-child(2) { animation-delay: 0.2s; }
.choice-btn:nth-child(3) { animation-delay: 0.3s; }
@keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}
.choice-btn:hover { background: rgba(168, 85, 247, 0.3); border-color: #a855f7; }
.dialogue-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
.control-btn {
    padding: 8px 15px;
    background: rgba(0,0,0,0.5);
    border: none;
    border-radius: 15px;
    color: #fff;
    cursor: pointer;
    font-size: 0.9rem;
}

/* ===== Toast ===== */
.toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    padding: 20px 40px;
    border-radius: 15px;
    font-size: 1.1rem;
    z-index: 300;
    display: none;
    animation: toastIn 0.3s ease;
}
@keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* ===== 每日结算 ===== */
.daily-end-content { text-align: center; max-width: 400px; }
.end-title {
    font-size: 2rem;
    margin-bottom: 30px;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.change-list {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 30px;
}
.change-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
.change-item:last-child { border-bottom: none; }
.next-day-btn {
    padding: 15px 40px;
    background: var(--gradient-primary);
    border: none;
    border-radius: 25px;
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    margin-bottom: 15px;
}

/* ===== 关系升级提示 ===== */
.relation-upgrade {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gradient-primary);
    padding: 15px 30px;
    border-radius: 25px;
    font-size: 1.1rem;
    z-index: 150;
    animation: slideDown 0.5s ease;
    display: none;
}
@keyframes slideDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 星空背景 -->
        <div class="starry-bg">
            <div class="stars-layer-1"></div>
            <div class="stars-layer-2"></div>
            <div class="stars-layer-3"></div>
        </div>

        <!-- 首页 -->
        <div id="landing-page" class="page active">
            <div class="landing-content">
                <h1 class="game-title">Bloom</h1>
                <p class="landing-subtitle">心动60天</p>
                <div class="intro-box">
                    <p>在60天内，通过6种日常活动邂逅5位性格迥异的女孩。</p>
                    <p>你的每一个选择，都会通往不同的故事。</p>
                </div>
                <div class="menu-buttons">
                    <button class="menu-btn primary" onclick="game.startNewStory()">✨ 开始新故事</button>
                    <button class="menu-btn secondary" id="btn-continue" onclick="game.continueGame()">📖 继续游戏</button>
                </div>
            </div>
        </div>

        <!-- MBTI入口页 -->
        <div id="mbti-page" class="page">
            <div class="mbti-entry-content">
                <h2 class="page-title">让我们先了解一下你</h2>
                <div class="mbti-entry-buttons">
                    <button class="entry-btn" onclick="game.goToMbtiSelect()">
                        <span class="entry-icon">💡</span>
                        <span class="entry-text">我知道我的MBTI</span>
                        <span class="entry-hint">直接选择，跳过测试</span>
                    </button>
                    <button class="entry-btn" onclick="game.goToMbtiTest()">
                        <span class="entry-icon">📝</span>
                        <span class="entry-text">帮我测试</span>
                        <span class="entry-hint">回答问题，找到你的MBTI</span>
                    </button>
                </div>
                <button class="skip-btn" onclick="game.skipToCharSelect()">跳过，直接选择角色 →</button>
            </div>
        </div>

        <!-- MBTI选择页 -->
        <div id="mbti-select-page" class="page">
            <div class="mbti-select-content">
                <h2 class="page-title">选择你的MBTI</h2>
                <div class="mbti-grid" id="mbti-grid"></div>
                <button class="confirm-btn" onclick="game.confirmMbti()" id="mbti-confirm-btn" disabled>确认选择</button>
            </div>
        </div>

        <!-- MBTI测试页 -->
        <div id="mbti-test-page" class="page">
            <div class="mbti-test-content">
                <div class="test-progress">
                    <span class="progress-text">第 <span id="q-num">1</span> / <span id="q-total">8</span> 题</span>
                    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                </div>
                <div class="question-box">
                    <p class="question-text" id="question-text"></p>
                    <div class="options-list" id="options-list"></div>
                </div>
                <div class="test-nav">
                    <button class="nav-btn back" onclick="game.testBack()">← 上一步</button>
                    <button class="nav-btn next" id="test-next-btn" onclick="game.testNext()" disabled>下一步 →</button>
                </div>
            </div>
        </div>

        <!-- MBTI结果页 -->
        <div id="mbti-result-page" class="page">
            <div class="mbti-result-content">
                <h2 class="result-title">你的MBTI是</h2>
                <div class="result-type" id="result-type">ISTJ</div>
                <div class="result-actions">
                    <button class="confirm-btn" onclick="game.confirmResult()">✓ 确认并继续</button>
                    <button class="retry-btn" onclick="game.retryTest()">重新测试</button>
                </div>
            </div>
        </div>

        <!-- 角色选择页 -->
        <div id="char-select-page" class="page">
            <div class="char-select-content">
                <h2 class="page-title">选择你想遇见的她</h2>
                <div class="char-grid" id="char-grid"></div>
                <button class="start-btn" onclick="game.startGame()" id="start-game-btn" disabled>开始冒险</button>
            </div>
        </div>

        <!-- 游戏主页 -->
        <div id="game-main-page" class="page">
            <div class="top-bar">
                <div class="day-info">
                    <span class="day-badge">Day <span id="day-num">1</span></span>
                </div>
                <div class="action-points" id="action-points">
                    <span class="action-point available"></span>
                    <span class="action-point available"></span>
                    <span class="action-point available"></span>
                </div>

    { q: '你的生活节奏是？', options: [{ text: '井井有条，计划周全', type: 'J' }, { text: '随性而为，灵活自由', type: 'P' }] },

// ========== 游戏状态 ==========
class GameState {
    constructor() {
        this.day = 1;
        this.maxDay = 60;
        this.energy = 100;
        this.maxEnergy = 100;
        this.actionPoints = 3;
        this.mbti = '';
        this.selectedChar = null;
        this.currentNode = null;
        this.charAttitudes = {};
        this.charUnlocked = {};
        
        Object.keys(CHARACTERS).forEach(id => {
            this.charAttitudes[id] = 50;
            this.charUnlocked[id] = false;
        });
    }
    
    reset() {
        this.day = 1;
        this.energy = 100;
        this.actionPoints = 3;
        this.currentNode = null;
        Object.keys(CHARACTERS).forEach(id => {
            this.charAttitudes[id] = 50;
            this.charUnlocked[id] = false;
        });
    }
    
    save() {
        const data = {
            day: this.day, energy: this.energy, mbti: this.mbti,
            selectedChar: this.selectedChar,
            charAttitudes: this.charAttitudes, charUnlocked: this.charUnlocked
        };
        localStorage.setItem('bloom_v3_save', JSON.stringify(data));
    }
    
    load() {
        const data = localStorage.getItem('bloom_v3_save');
        if (!data) return false;
        Object.assign(this, JSON.parse(data));
        return true;
    }
    
    hasSave() { return !!localStorage.getItem('bloom_v3_save'); }
}

// ========== 游戏引擎 ==========
class GameEngine {
    constructor() {
        this.state = new GameState();
        this.currentTestQuestion = 0;
        this.testAnswers = [];
        this.selectedMbti = '';
        this.selectedCharId = null;
        this.isTyping = false;
        this.typingTimeout = null;
        this.currentChoices = [];
        
        this.init();
    }
    
    init() {
        this.renderMbtiGrid();
        this.renderCharGrid();
        this.renderActivityGrid();
        this.checkContinue();
    }
    
    showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id)?.classList.add('active');
    }
    
    checkContinue() {
        const btn = document.getElementById('btn-continue');
        if (btn) btn.disabled = !this.state.hasSave();
    }
    
    // ===== MBTI相关 =====
    renderMbtiGrid() {
        const grid = document.getElementById('mbti-grid');
        if (!grid) return;
        const types = ['INTJ', 'INTP', 'ENTJ', 'ENTP', 'INFJ', 'INFP', 'ENFJ', 'ENFP', 
                       'ISTJ', 'ISFJ', 'ESTJ', 'ESFJ', 'ISTP', 'ISFP', 'ESTP', 'ESFP'];
        grid.innerHTML = types.map(t => `<button onclick="game.selectMbti('${t}')">${t}</button>`).join('');
    }
    
    goToMbtiSelect() { this.showPage('mbti-select-page'); }
    goToMbtiTest() { this.showPage('mbti-test-page'); this.currentTestQuestion = 0; this.testAnswers = []; this.renderQuestion(); }
    skipToCharSelect() { this.showPage('char-select-page'); }
    
    selectMbti(type) {
        this.selectedMbti = type;
        document.querySelectorAll('#mbti-grid button').forEach(b => b.classList.remove('selected'));
        event.target.classList.add('selected');
        document.getElementById('mbti-confirm-btn').disabled = false;
    }
    
    confirmMbti() {
        this.state.mbti = this.selectedMbti;
        document.getElementById('result-type').textContent = this.selectedMbti;
        this.showPage('mbti-result-page');
    }
    
    renderQuestion() {
        const q = MBTI_QUESTIONS[this.currentTestQuestion];
        document.getElementById('q-num').textContent = this.currentTestQuestion + 1;
        document.getElementById('q-total').textContent = MBTI_QUESTIONS.length;
        document.getElementById('progress-fill').style.width = (this.currentTestQuestion / MBTI_QUESTIONS.length * 100) + '%';
        document.getElementById('question-text').textContent = q.q;
        document.getElementById('options-list').innerHTML = q.options.map((o, i) => 
            `<button class="option-btn ${this.testAnswers[this.currentTestQuestion] === i ? 'selected' : ''}" onclick="game.answerQuestion(${i})">${o.text}</button>`
        ).join('');
        document.getElementById('test-next-btn').disabled = this.testAnswers[this.currentTestQuestion] === undefined;
    }
    
    answerQuestion(idx) {
        this.testAnswers[this.currentTestQuestion] = idx;
        this.renderQuestion();
    }
    
    testBack() {
        if (this.currentTestQuestion > 0) { this.currentTestQuestion--; this.renderQuestion(); }
    }
    
    testNext() {
        if (this.currentTestQuestion < MBTI_QUESTIONS.length - 1) {
            this.currentTestQuestion++;
            this.renderQuestion();
        } else {
            this.calculateMbti();
        }
    }
    
    calculateMbti() {
        const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        this.testAnswers.forEach((a, i) => {
            const type = MBTI_QUESTIONS[i].options[a].type;
            counts[type]++;
        });
        let result = '';
        result += counts['E'] > counts['I'] ? 'E' : 'I';
        result += counts['S'] > counts['N'] ? 'S' : 'N';
        result += counts['T'] > counts['F'] ? 'T' : 'F';
        result += counts['J'] > counts['P'] ? 'J' : 'P';
        this.selectedMbti = result;
        this.state.mbti = result;
        document.getElementById('result-type').textContent = result;
        this.showPage('mbti-result-page');
    }
    
    retryTest() { this.currentTestQuestion = 0; this.testAnswers = []; this.showPage('mbti-test-page'); this.renderQuestion(); }
    confirmResult() { this.showPage('char-select-page'); }
    
    // ===== 角色选择 =====
    renderCharGrid() {
        const grid = document.getElementById('char-grid');
        if (!grid) return;
        grid.innerHTML = Object.values(CHARACTERS).map(c => `
            <div class="char-card" style="--char-color: ${c.color}; --char-glow: ${c.color}40;" onclick="game.selectChar('${c.id}')" id="char-${c.id}">
                <div class="char-avatar" style="border-color: ${c.color}; background: ${c.color}20;">
                    <img src="${c.avatar}" alt="${c.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <span style="display:none; color: ${c.color}; font-size: 2rem;">${c.name[0]}</span>
                </div>
                <div class="char-name">${c.name}</div>
                <div class="char-trait">${c.trait}</div>
                <div class="char-affection-bar">
                    <div class="char-affection-fill" style="width: ${this.state.charAttitudes[c.id] || 50}%; background: ${c.color};"></div>
                </div>
            </div>
        `).join('');
    }
    
    selectChar(id) {
        this.selectedCharId = id;
        this.state.selectedChar = id;
        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
        document.getElementById('char-' + id).classList.add('selected');
        document.getElementById('start-game-btn').disabled = false;
    }
    
    startNewStory() {
        if (this.state.hasSave() && confirm('继续已有存档还是开始新游戏？')) {
            this.continueGame();
        } else {
            this.state.reset();
            this.showPage('mbti-page');
        }
    }
    
    startGame() {
        if (!this.selectedCharId) return;
        this.state.selectedChar = this.selectedCharId;
        this.state.charUnlocked[this.selectedCharId] = true;
        this.state.save();
        this.renderActivityGrid();
        this.showPage('game-main-page');
        this.updateUI();
        this.showToast('🎉 ' + CHARACTERS[this.selectedCharId].name + ' 的故事开始了！');
    }
    
    continueGame() {
        if (this.state.load()) {
            this.selectedCharId = this.state.selectedChar;
            this.renderActivityGrid();
            this.showPage('game-main-page');
            this.updateUI();
            this.showToast('📖 继续游戏');
        }
    }
    
    // ===== 活动系统 =====
    renderActivityGrid() {
        const grid = document.getElementById('activity-grid');
        if (!grid) return;
        grid.innerHTML = Object.values(ACTIVITIES).map(a => `
            <div class="activity-card ${this.state.energy < a.energy || this.state.actionPoints <= 0 ? 'disabled' : ''}" 
                 onclick="game.doActivity('${a.id}')" id="activity-${a.id}">
                <div class="activity-icon">${a.icon}</div>
                <div class="activity-name">${a.name}</div>
                <div class="activity-desc">${a.desc}</div>
                <div class="activity-energy">-${a.energy}</div>
            </div>
        `).join('');
    }
    
    doActivity(activityId) {
        const activity = ACTIVITIES[activityId];
        if (this.state.energy < activity.energy || this.state.actionPoints <= 0) {
            this.showToast('⚠️ 精力不足或行动点用完！');
            return;
        }
        
        this.state.energy -= activity.energy;
        this.state.actionPoints--;
        this.state.save();
        this.updateUI();
        
        if (activity.charId) {
            this.startDialogue(activity.charId, activity.sceneClass);
        } else {
            this.showToast('☕ 在咖啡厅度过悠闲时光...');
            this.state.energy += 10;
            this.state.actionPoints++;
            this.state.save();
            this.updateUI();
        }
    }
    
    // ===== 对话系统（核心：打字机效果）=====
    startDialogue(charId, sceneClass) {
        const char = CHARACTERS[charId];
        this.state.currentNode = 'intro';
        
        // 设置场景背景
        const sceneArea = document.getElementById('scene-area');
        sceneArea.className = 'scene-area ' + (sceneClass || 'scene-' + char.scene);
        
        // 设置角色立绘
        const portrait = document.getElementById('char-portrait');
        portrait.src = char.fullImg;
        portrait.style.setProperty('--char-color', char.color);
        portrait.style.setProperty('--char-glow', char.color + '80');
        
        // 设置头像
        const avatar = document.getElementById('speaker-avatar');
        avatar.src = char.avatar;
        avatar.style.borderColor = char.color;
        
        // 设置角色名
        const nameEl = document.getElementById('speaker-name');
        nameEl.textContent = char.name;
        nameEl.style.color = char.color;
        
        // 显示对话框
        document.getElementById('dialogue-overlay').classList.add('active');
        
        // 获取故事节点
        const nodes = STORY_NODES[charId];
        const node = nodes.intro;
        
        // 显示场景描述
        document.getElementById('scene-desc').textContent = node.scene;
        
        // 打字机效果显示对话
        this.typeText(node.dialogue, () => {
            this.showChoices(node.choices, charId);
        });
    }
    
    typeText(text, callback) {
        this.isTyping = true;
        const textEl = document.getElementById('dialogue-text');
        const cursorEl = document.getElementById('typing-cursor');
        let idx = 0;
        
        textEl.textContent = '';
        cursorEl.style.display = 'inline';
        document.getElementById('choices-area').innerHTML = '';
        
        const type = () => {
            if (idx < text.length) {
                textEl.textContent += text[idx];
                idx++;
                this.typingTimeout = setTimeout(type, 50);
            } else {
                this.isTyping = false;
                cursorEl.style.display = 'none';
                if (callback) callback();
            }
        };
        type();
    }
    
    skipDialogue() {
        if (this.typingTimeout) {
            clearTimeout(this.typingTimeout);
        }
        this.isTyping = false;
        document.getElementById('typing-cursor').style.display = 'none';
        
        // 如果有等待中的回调，立即触发
        const choicesArea = document.getElementById('choices-area');
        if (choicesArea.children.length === 0 && this.currentChoices.length > 0) {
            this.showChoices(this.currentChoices, this.state.selectedChar);
        }
    }
    
    showChoices(choices, charId) {
        this.currentChoices = choices;
        const choicesArea = document.getElementById('choices-area');
        choicesArea.innerHTML = choices.map((c, i) => 
            `<button class="choice-btn" onclick="game.makeChoice(${i})">${c.text}</button>`
        ).join('');
    }
    
    makeChoice(idx) {
        const choice = this.currentChoices[idx];
        if (!choice) return;
        
        const charId = this.state.selectedChar;
        
        // 检查是否是结局
        if (choice.next === 'restart') {
            this.closeDialogue();
            this.state.reset();
            this.state.save();
            this.showPage('char-select-page');
            this.renderCharGrid();
            this.showToast('🔄 开始新游戏');
            return;
        }
        
        // 如果是结局
        if (choice.isEnding) {
            // 显示结局
            const char = CHARACTERS[charId];
            const nodes = STORY_NODES[charId];
            const node = nodes[choice.next];
            
            document.getElementById('scene-desc').textContent = node.scene;
            this.typeText(node.dialogue, () => {
                this.showChoices(node.choices, charId);
            });
            
            // 关系变化
            if (choice.delta > 0) {
                this.state.charAttitudes[charId] = Math.min(100, this.state.charAttitudes[charId] + choice.delta);
            }
            this.state.save();
            return;
        }
        
        // 更新好感度
        if (choice.delta) {
            const oldAtt = this.state.charAttitudes[charId];
            this.state.charAttitudes[charId] = Math.max(0, Math.min(100, this.state.charAttitudes[charId] + choice.delta));
            this.checkRelationUpgrade(charId, oldAtt, this.state.charAttitudes[charId]);
            this.showToast(`💕 好感度 ${choice.delta > 0 ? '+' : ''}${choice.delta}`);
        }
        
        this.state.currentNode = choice.next;
        this.state.save();
        
        // 显示下一个节点
        const nodes = STORY_NODES[charId];
        const nextNode = nodes[choice.next];
        if (nextNode) {
            document.getElementById('scene-desc').textContent = nextNode.scene;
            this.typeText(nextNode.dialogue, () => {
                this.showChoices(nextNode.choices, charId);
            });
        }
    }
    
    checkRelationUpgrade(charId, oldAtt, newAtt) {
        const stages = [
            { min: 90, name: '恋人', icon: '💕' },
            { min: 70, name: '暧昧', icon: '✨' },
            { min: 50, name: '好朋友', icon: '🤝' },
            { min: 30, name: '普通朋友', icon: '👋' }
        ];
        
        const oldStage = stages.find(s => oldAtt >= s.min);
        const newStage = stages.find(s => newAtt >= s.min);
        
        if (newStage && (!oldStage || oldStage.min !== newStage.min)) {
            const el = document.getElementById('relation-upgrade');
            el.textContent = `${newStage.icon} ${CHARACTERS[charId].name} 关系升级为：${newStage.name}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }
    }
    
    closeDialogue() {
        document.getElementById('dialogue-overlay').classList.remove('active');
        this.currentChoices = [];
        this.updateUI();
    }
    
    // ===== UI更新 =====
    updateUI() {
        document.getElementById('day-num').textContent = this.state.day;
        document.getElementById('action-remain').textContent = this.state.actionPoints;
        
        const points = document.getElementById('action-points');
        points.innerHTML = Array(3).fill(0).map((_, i) => 
            `<span class="action-point ${i < this.state.actionPoints ? 'available' : ''}"></span>`
        ).join('');
        
        this.renderActivityGrid();
    }
    
    sleep() {
        this.showPage('daily-end-page');
        document.getElementById('end-day').textContent = this.state.day;
        document.getElementById('next-day-num').textContent = this.state.day + 1;
        
        const char = CHARACTERS[this.state.selectedChar];
        const att = this.state.charAttitudes[this.state.selectedChar];
        const list = document.getElementById('change-list');
        list.innerHTML = `
            <div class="change-item">
                <span>${char.name}</span>
                <span style="color: ${att > 50 ? '#4ade80' : '#f87171'}">好感度: ${att}</span>
            </div>
        `;
    }
    
    nextDay() {
        this.state.day++;
        this.state.actionPoints = 3;
        this.state.energy = Math.min(this.state.maxEnergy, this.state.energy + 50);
        this.state.save();
        
        if (this.state.day > this.state.maxDay) {
            this.showEnding();
            return;
        }
        
        this.updateUI();
        this.showPage('game-main-page');
        this.showToast(`🌅 第${this.state.day}天开始了！`);
    }
    
    showEnding() {
        const att = this.state.charAttitudes[this.state.selectedChar];
        const char = CHARACTERS[this.state.selectedChar];
        let ending = '';
        
        if (att >= 90) {
            ending = `💕 ${char.name}的HE结局\n\n经过${this.state.maxDay}天的相处，你们终于在一起了...`;
        } else if (att >= 70) {
            ending = `✨ ${char.name}的NE结局\n\n你们成为了很好的朋友...`;
        } else {
            ending = `💔 ${char.name}的BE结局\n\n最终，你们渐行渐远...`;
        }
        
        alert(ending + '\n\n感谢游玩《Bloom》！');
        this.state.reset();
        this.state.save();
        this.showPage('landing-page');
    }
    
    showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }
}

const game = new GameEngine();
    </script>
</body>
