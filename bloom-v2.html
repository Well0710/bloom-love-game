<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom - 百合恋爱互动游戏</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            min-height: 100vh;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 首页 ===== */
        #home-page {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #home-page.active {
            display: flex;
        }

        .game-logo {
            font-size: 6rem;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .game-title {
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .game-subtitle {
            font-size: 1.3rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
            line-height: 1.6;
        }

        .intro-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin-bottom: 40px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .intro-card h3 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .intro-card p {
            color: rgba(255,255,255,0.85);
            line-height: 1.8;
            font-size: 1rem;
        }

        .feature-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .feature-item {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
        }

        .feature-item .icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            padding: 18px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.25);
            color: #fff;
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255,255,255,0.35);
            transform: translateY(-3px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 角色创建页 ===== */
        .create-container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .page-title {
            font-size: 2rem;
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .mbti-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            padding: 20px;
            border-radius: 15px;
            margin-top: 15px;
        }

        .mbti-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 0.95rem;
            border: 2px solid #667eea;
            border-radius: 25px;
            background: #fff;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-small:hover {
            background: #667eea;
            color: #fff;
        }

        .btn-small.active {
            background: #667eea;
            color: #fff;
        }

        .mbti-result {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            color: #333;
        }

        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .mbti-type-btn {
            padding: 8px 5px;
            font-size: 0.85rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .mbti-type-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .mbti-type-btn.selected {
            background: #667eea;
            color: #fff;
            border-color: #667eea;
        }

        /* ===== MBTI 测试页 ===== */
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .test-progress {
            text-align: center;
            font-size: 1.1rem;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .question-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            padding: 30px;
            border-radius: 20px;
            font-size: 1.2rem;
            color: #333;
            text-align: center;
            line-height: 1.8;
            margin-bottom: 30px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .test-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            padding: 18px 25px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-align: left;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        /* ===== 游戏主界面 ===== */
        #game-page {
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        .game-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: background 0.5s;
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .chapter-title {
            font-size: 1.2rem;
            color: #333;
            font-weight: bold;
        }

        .affection-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .affection-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.8);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .affection-item .heart {
            font-size: 1rem;
        }

        .game-content {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
        }

        .character-sprite {
            width: 200px;
            height: 350px;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);
            border-radius: 20px 20px 0 0;
            margin-right: 30px;
        }

        .dialogue-box {
            flex: 1;
            max-width: 800px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .speaker-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #e84393;
            margin-bottom: 15px;
        }

        .dialogue-text {
            font-size: 1.15rem;
            color: #333;
            line-height: 2;
            min-height: 80px;
            margin-bottom: 20px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            padding: 16px 25px;
            font-size: 1rem;
            border: 2px solid #e84393;
            border-radius: 15px;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-align: left;
        }

        .choice-btn:hover {
            background: #e84393;
            color: #fff;
            transform: translateX(5px);
        }

        .game-footer {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .btn-icon {
            padding: 12px 25px;
            font-size: 0.95rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            backdrop-filter: blur(5px);
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        /* ===== 存档页 ===== */
        .save-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .save-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .save-card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .save-card.empty {
            opacity: 0.7;
        }

        .save-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .save-info {
            font-size: 0.9rem;
            color: #666;
            margin: 5px 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .game-title {
                font-size: 2.5rem;
            }

            .game-logo {
                font-size: 4rem;
            }

            .feature-list {
                grid-template-columns: 1fr;
            }

            .create-container,
            .test-container {
                padding: 25px 20px;
            }

            .mbti-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .game-content {
                flex-direction: column;
                align-items: center;
            }

            .character-sprite {
                display: none;
            }

            .dialogue-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div id="home-page" class="page active">
        <div class="game-logo">🌸</div>
        <h1 class="game-title">Bloom</h1>
        <p class="game-subtitle">一段关于爱与成长的故事</p>

        <div class="intro-card">
            <h3>✨ 游戏特色</h3>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="icon">💕</div>
                    <div>5 位可攻略角色</div>
                </div>
                <div class="feature-item">
                    <div class="icon">🎭</div>
                    <div>MBTI 人格测试</div>
                </div>
                <div class="feature-item">
                    <div class="icon">📖</div>
                    <div>多分支剧情</div>
                </div>
                <div class="feature-item">
                    <div class="icon">🌈</div>
                    <div>10+ 种结局</div>
                </div>
            </div>
        </div>

        <div class="menu-buttons">
            <button class="btn btn-primary" onclick="game.goToCreate()">✨ 新的故事</button>
            <button class="btn btn-secondary" id="btn-continue-home" onclick="game.continueGame()" disabled>📖 继续游戏</button>
            <button class="btn btn-secondary" onclick="game.goToSave('load')">📂 读取存档</button>
        </div>
    </div>

    <!-- 角色创建页 -->
    <div id="create-page" class="page">
        <div class="create-container">
            <h2 class="page-title">创建你的角色</h2>

            <div class="form-group">
                <label>你的名字</label>
                <input type="text" id="player-name" placeholder="请输入名字" maxlength="10" oninput="game.checkCreateComplete()">
            </div>

            <div class="form-group">
                <label>年龄</label>
                <input type="number" id="player-age" placeholder="20-40" min="20" max="40" oninput="game.checkCreateComplete()">
            </div>

            <div class="form-group">
                <label>职业</label>
                <input type="text" id="player-job" placeholder="例如：设计师、程序员、作家..." maxlength="20" oninput="game.checkCreateComplete()">
            </div>

            <div class="form-group">
                <label>MBTI 人格</label>
                <div class="mbti-section">
                    <div class="mbti-buttons">
                        <button class="btn-small" id="btn-mbti-direct" onclick="game.showMBTIDirect()">直接选择</button>
                        <button class="btn-small" id="btn-mbti-test" onclick="game.startMBTITest()">10 题测试</button>
                    </div>
                    <div id="mbti-result" class="mbti-result" style="display: none;"></div>
                    <div id="mbti-grid" class="mbti-grid" style="display: none;"></div>
                </div>
            </div>

            <button class="btn btn-primary" id="btn-start-game" onclick="game.createCharacter()" style="width: 100%; margin-top: 20px;" disabled>开始故事</button>
            <button class="btn btn-secondary" onclick="game.goHome()" style="width: 100%; margin-top: 10px;">返回标题</button>
        </div>
    </div>

    <!-- MBTI 测试页 -->
    <div id="test-page" class="page">
        <div class="test-container">
            <h2 class="page-title">MBTI 人格测试</h2>

            <div class="test-progress">
                <span id="current-q">1</span> / 10
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 10%;"></div>
                </div>
            </div>

            <div class="question-box" id="test-question">
                加载中...
            </div>

            <div class="test-options" id="test-options">
                <!-- 选项动态生成 -->
            </div>

            <button class="btn btn-secondary" onclick="game.goToCreate()" style="width: 100%; margin-top: 20px;">返回</button>
        </div>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-page" class="page">
        <div class="game-background" id="game-background"></div>

        <div class="game-container">
            <div class="game-header">
                <span class="chapter-title" id="chapter-title">第 1 章</span>
                <div class="affection-bar" id="affection-display"></div>
            </div>

            <div class="game-content">
                <div class="character-sprite" id="character-sprite"></div>
                <div class="dialogue-box">
                    <div class="speaker-name" id="speaker-name"></div>
                    <div class="dialogue-text" id="dialogue-text"></div>
                    <div class="choices-container" id="choices-container"></div>
                </div>
            </div>

            <div class="game-footer">
                <button class="btn-icon" onclick="game.showSave('save')">💾 保存</button>
                <button class="btn-icon" onclick="game.showSave('load')">📂 读取</button>
                <button class="btn-icon" onclick="game.goHome()">🏠 标题</button>
            </div>
        </div>
    </div>

    <!-- 存档页 -->
    <div id="save-page" class="page">
        <div class="create-container">
            <h2 class="page-title" id="save-title">💾 保存进度</h2>

            <div class="save-grid" id="save-slots"></div>

            <button class="btn btn-secondary" onclick="game.backToGame()" style="width: 100%;">返回</button>
        </div>
    </div>

    <script>
        // ===== 角色数据 =====
        const CHARACTERS = {
            player: { name: '', age: 0, job: '', mbti: '' },
            linwanqing: { id: 'linwanqing', name: '林婉清', age: 32, height: 178, mbti: 'ENTJ', job: '林氏集团总裁', color: '#8e44ad', affection: 0 },
            xiayang: { id: 'xiayang', name: '夏阳', age: 24, height: 175, mbti: 'ENTP', job: '清华大学研二学生', color: '#e67e22', affection: 0 },
            sujingyi: { id: 'sujingyi', name: '苏静怡', age: 28, height: 168, mbti: 'ISTJ', job: '医院主治医师', color: '#3498db', affection: 0 },
            wenya: { id: 'wenya', name: '温雅', age: 26, height: 172, mbti: 'INFP', job: '中学美术老师', color: '#fd79a8', affection: 0 },
            luxiao: { id: 'luxiao', name: '陆潇', age: 29, height: 177, mbti: 'ENFJ', job: '法餐主理人', color: '#2d3436', affection: 0 }
        };

        function resetCharacterAffection() {
            Object.keys(CHARACTERS).forEach(key => {
                if (key !== 'player') CHARACTERS[key].affection = 0;
            });
        }

        function getAllCharacters() {
            return Object.keys(CHARACTERS).filter(key => key !== 'player').map(key => CHARACTERS[key]);
        }

        function changeAffection(characterId, amount) {
            if (CHARACTERS[characterId]) {
                CHARACTERS[characterId].affection += amount;
                CHARACTERS[characterId].affection = Math.max(0, Math.min(100, CHARACTERS[characterId].affection));
            }
        }

        // ===== MBTI 测试 =====
        const MBTI_QUESTIONS = [
            { text: "在社交聚会上，你通常会？", options: [{ text: "主动认识很多人，享受热闹", type: 'E' }, { text: "和熟悉的人聊天，或在一旁观察", type: 'I' }] },
            { text: "做决定时，你更倾向于？", options: [{ text: "相信直觉和灵感", type: 'N' }, { text: "依据事实和经验", type: 'S' }] },
            { text: "面对问题时，你习惯？", options: [{ text: "先分析逻辑，再下结论", type: 'T' }, { text: "先考虑感受，再决定", type: 'F' }] },
            { text: "你的生活方式更接近？", options: [{ text: "有计划有条理，喜欢确定性", type: 'J' }, { text: "灵活随性，保持开放性", type: 'P' }] },
            { text: "周末你更愿意？", options: [{ text: "和朋友出去玩或参加活动", type: 'E' }, { text: "宅在家里做自己喜欢的事", type: 'I' }] },
            { text: "学习新东西时，你更关注？", options: [{ text: "整体概念和可能性", type: 'N' }, { text: "具体细节和实际应用", type: 'S' }] },
            { text: "朋友向你倾诉烦恼，你会？", options: [{ text: "帮 ta 分析问题，给出建议", type: 'T' }, { text: "先安慰 ta，理解 ta 的感受", type: 'F' }] },
            { text: "旅行前你会？", options: [{ text: "做好详细攻略和计划", type: 'J' }, { text: "只定大致方向，随遇而安", type: 'P' }] },
            { text: "工作中你更喜欢？", options: [{ text: "团队合作，集思广益", type: 'E' }, { text: "独立工作，深度专注", type: 'I' }] },
            { text: "你更欣赏哪种人？", options: [{ text: "有创意、想法独特的人", type: 'N' }, { text: "踏实可靠、执行力强的人", type: 'S' }] }
        ];

        const MBTI_TYPES = ['INTJ', 'INTP', 'ENTJ', 'ENTP', 'INFJ', 'INFP', 'ENFJ', 'ENFP', 'ISTJ', 'ISFJ', 'ESTJ', 'ESFJ', 'ISTP', 'ISFP', 'ESTP', 'ESFP'];

        const MBTI_DESCRIPTIONS = {
            'INTJ': '建筑师 - 富有想象力和战略性的思想家',

        // ===== 存档系统 =====
        const SAVE_VERSION = '1.0';
        const MAX_SAVE_SLOTS = 6;

        class SaveSystem {
            constructor() {
                this.storageKey = 'bloom_love_saves';
                this.saves = this.loadSaves();
            }

            loadSaves() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            save(slotIndex, gameState) {
                const saveData = {
                    version: SAVE_VERSION,
                    timestamp: Date.now(),
                    chapter: gameState.currentChapter,
                    playerName: gameState.player.name,
                    playerMbti: gameState.player.mbti,
                    storyProgress: gameState.currentStoryId,
                    characters: {}
                };
                Object.keys(CHARACTERS).forEach(key => {
                    if (key !== 'player') {
                        saveData.characters[key] = {
                            affection: CHARACTERS[key].affection,
                            met: gameState.metCharacters?.includes(key) || false
                        };
                    }
                });
                this.saves[slotIndex] = saveData;
                this.persist();
                return true;
            }

            load(slotIndex) {
                const saveData = this.saves[slotIndex];
                if (!saveData) return null;

                resetCharacterAffection();
                Object.keys(saveData.characters).forEach(key => {
                    if (CHARACTERS[key]) {
                        CHARACTERS[key].affection = saveData.characters[key].affection || 0;
                    }
                });

                return {
                    currentChapter: saveData.chapter,
                    currentStoryId: saveData.storyProgress,
                    player: { name: saveData.playerName, mbti: saveData.playerMbti },
                    metCharacters: Object.keys(saveData.characters).filter(key => saveData.characters[key].met)
                };
            }

            getSaveInfo(slotIndex) {
                const saveData = this.saves[slotIndex];
                if (!saveData) return null;

                const date = new Date(saveData.timestamp);
                const now = new Date();
                const diff = now - date;
                let formattedTime;
                if (diff < 24 * 60 * 60 * 1000 && date.getDate() === now.getDate()) {
                    formattedTime = `今天 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                } else if (diff < 48 * 60 * 60 * 1000) {
                    formattedTime = `昨天 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                } else {
                    formattedTime = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                }

                return {
                    exists: true,
                    timestamp: saveData.timestamp,
                    chapter: saveData.chapter,
                    playerName: saveData.playerName,
                    playerMbti: saveData.playerMbti,
                    formattedTime: formattedTime
                };
            }

            hasSaves() {
                return this.saves.some(save => save !== null && save !== undefined);
            }

            persist() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.saves));
                } catch (e) {}
            }

            getAllSlots() {
                const slots = [];
                for (let i = 0; i < MAX_SAVE_SLOTS; i++) {
                    slots.push({ index: i, info: this.getSaveInfo(i) });
                }
                return slots;
            }
        }

        const saveSystem = new SaveSystem();

                this.flags = {};
            }

            reset() {
                this.player = { ...CHARACTERS.player };
                this.currentChapter = 1;
                this.currentStoryId = 'start';
                this.metCharacters = [];
                this.flags = {};
                resetCharacterAffection();
            }

            setPlayer(name, age, job, mbti) {
                this.player.name = name;
                this.player.age = age;
                this.player.job = job;
                this.player.mbti = mbti;
            }

            markMet(characterId) {
                if (!this.metCharacters.includes(characterId)) {
                    this.metCharacters.push(characterId);
                }
            }

            export() {
                return {
                    player: this.player,
                    currentChapter: this.currentChapter,
                    currentStoryId: this.currentStoryId,
                    metCharacters: this.metCharacters,
                    flags: this.flags
                };
            }

            import(state) {
                this.player = { ...this.player, ...state.player };
                this.currentChapter = state.currentChapter;
                this.currentStoryId = state.currentStoryId;
                this.metCharacters = state.metCharacters || [];
                this.flags = state.flags || {};
            }
        }

        // ===== 游戏引擎 =====
        class GameEngine {
            constructor() {
                this.currentStory = null;
                this.isTyping = false;
                this.typingTimer = null;
                this.fullText = '';
                this.displayedText = '';
                this.mbtiTest = {
                    currentQuestion: 0,
                    scores: { E: 0, I: 0, N: 0, S: 0, T: 0, F: 0, J: 0, P: 0 },
                    onComplete: null
                };
                this.saveMode = 'save';
                this.init();
            }

            init() {
                this.checkSaves();
                this.showPage('home-page');
            }

            showPage(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
            }

            checkSaves() {
                const btn = document.getElementById('btn-continue-home');
                if (btn) btn.disabled = !saveSystem.hasSaves();
            }

            goHome() {
                this.checkSaves();
                this.showPage('home-page');
            }

            goToCreate() {
                gameState.reset();
                this.showPage('create-page');
                this.checkCreateComplete();
            }

            goToSave(mode) {
                this.saveMode = mode;
                document.getElementById('save-title').textContent = mode === 'save' ? '💾 保存进度' : '📂 读取存档';
                this.renderSaveSlots();
                this.showPage('save-page');
            }

            showSave(mode) {
                this.saveMode = mode;
                document.getElementById('save-title').textContent = mode === 'save' ? '💾 保存进度' : '📂 读取存档';
                this.renderSaveSlots();
                this.showPage('save-page');
            }

            backToGame() {
                this.showPage('game-page');
            }

            continueGame() {
                const slots = saveSystem.getAllSlots();
                const latestSlot = slots.filter(s => s.info).sort((a, b) => b.info.timestamp - a.info.timestamp)[0];
                if (latestSlot) {
                    this.loadGame(latestSlot.index);
                }
            }

            checkCreateComplete() {
                const name = document.getElementById('player-name')?.value.trim();
                const age = document.getElementById('player-age')?.value;
                const job = document.getElementById('player-job')?.value.trim();
                const mbti = gameState.player.mbti;
                const btn = document.getElementById('btn-start-game');
                if (btn) btn.disabled = !(name && age && job && mbti);
            }

            showMBTIDirect() {
                const grid = document.getElementById('mbti-grid');
                const result = document.getElementById('mbti-result');
                grid.style.display = 'grid';
                result.style.display = 'none';

                grid.innerHTML = MBTI_TYPES.map(type =>
                    `<button class="mbti-type-btn" onclick="game.selectMBTI('${type}')">${type}</button>`
                ).join('');
            }

            selectMBTI(type) {
                gameState.player.mbti = type;
                document.querySelectorAll('.mbti-type-btn').forEach(btn => btn.classList.remove('selected'));
                event.target.classList.add('selected');

                document.getElementById('mbti-result').innerHTML = `✅ 已选择：<strong>${type}</strong> - ${MBTI_DESCRIPTIONS[type]}`;
                document.getElementById('mbti-result').style.display = 'block';
                document.getElementById('mbti-grid').style.display = 'none';
                this.checkCreateComplete();
            }

            startMBTITest() {
                this.mbtiTest.currentQuestion = 0;
                this.mbtiTest.scores = { E: 0, I: 0, N: 0, S: 0, T: 0, F: 0, J: 0, P: 0 };
                this.showPage('test-page');
                this.showTestQuestion();
            }

            showTestQuestion() {
                const q = MBTI_QUESTIONS[this.mbtiTest.currentQuestion];
                document.getElementById('current-q').textContent = this.mbtiTest.currentQuestion + 1;
                document.getElementById('progress-fill').style.width = ((this.mbtiTest.currentQuestion + 1) * 10) + '%';
                document.getElementById('test-question').textContent = q.text;

                const optionsEl = document.getElementById('test-options');
                optionsEl.innerHTML = q.options.map(opt =>
                    `<button class="option-btn" onclick="game.answerMBTI('${opt.type}')">${opt.text}</button>`
                ).join('');
            }

            answerMBTI(type) {
                this.mbtiTest.scores[type]++;
                this.mbtiTest.currentQuestion++;

                if (this.mbtiTest.currentQuestion >= MBTI_QUESTIONS.length) {
                    const result = [
                        this.mbtiTest.scores.E >= this.mbtiTest.scores.I ? 'E' : 'I',
                        this.mbtiTest.scores.N >= this.mbtiTest.scores.S ? 'N' : 'S',
                        this.mbtiTest.scores.T >= this.mbtiTest.scores.F ? 'T' : 'F',
                        this.mbtiTest.scores.J >= this.mbtiTest.scores.P ? 'J' : 'P'
                    ].join('');

                    gameState.player.mbti = result;
                    document.getElementById('mbti-result').innerHTML = `🎉 测试结果：<strong>${result}</strong> - ${MBTI_DESCRIPTIONS[result]}`;
                    document.getElementById('mbti-result').style.display = 'block';
                    this.showPage('create-page');
                    this.checkCreateComplete();
                } else {
                    this.showTestQuestion();
                }
            }

            createCharacter() {
                const name = document.getElementById('player-name').value.trim();
                const age = parseInt(document.getElementById('player-age').value);
                const job = document.getElementById('player-job').value.trim();
                const mbti = gameState.player.mbti;

                gameState.setPlayer(name, age, job, mbti);
                this.startStory('start');
            }

            startStory(storyId) {
                const story = STORIES[storyId];
                if (!story) {
                    console.error('剧情不存在:', storyId);
                    return;
                }

                this.currentStory = story;
                gameState.currentStoryId = storyId;
                gameState.currentChapter = story.chapter;

                this.showPage('game-page');
                this.renderStory(story);
            }

            renderStory(story) {
                document.getElementById('game-background').style.background = story.bg;
                document.getElementById('chapter-title').textContent = story.chapter > 0 ? `第${story.chapter}章 ${story.title || ''}` : story.title || '';

                const sprite = document.getElementById('character-sprite');
                if (story.sprite && CHARACTERS[story.sprite]) {
                    sprite.style.background = `linear-gradient(180deg, ${CHARACTERS[story.sprite].color} 0%, transparent 100%)`;
                    sprite.style.display = 'block';
                } else {
                    sprite.style.display = 'none';
                }

                const speakerEl = document.getElementById('speaker-name');
                if (story.speaker) {
                    speakerEl.textContent = story.speaker;
                    speakerEl.style.display = 'block';
                } else {
                    speakerEl.style.display = 'none';
                }

                this.updateAffectionDisplay();

                this.fullText = story.text;
                this.displayedText = '';
                this.isTyping = true;
                document.getElementById('dialogue-text').textContent = '';
                this.typeText(story.text);

                this.renderChoices(story.choices);
            }

            typeText(text) {
                if (!this.isTyping) return;
                const chars = text.split('');
                let index = 0;

                const type = () => {
                    if (index < chars.length && this.isTyping) {
                        this.displayedText += chars[index];
                        document.getElementById('dialogue-text').textContent = this.displayedText;
                        index++;
                        this.typingTimer = setTimeout(type, 30);
                    } else {
                        this.isTyping = false;
                    }
                };
                type();
            }

            renderChoices(choices) {
                const container = document.getElementById('choices-container');
                container.innerHTML = '';

                if (!choices || choices.length === 0) return;

                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.onclick = () => this.makeChoice(choice);
                    container.appendChild(btn);
                });
            }

            makeChoice(choice) {
                if (choice.affection) {
                    Object.keys(choice.affection).forEach(charId => {
                        changeAffection(charId, choice.affection[charId]);
                        gameState.markMet(charId);
                    });
                    this.updateAffectionDisplay();
                }

                if (choice.next) {
                    this.startStory(choice.next);
                }
            }

            updateAffectionDisplay() {
                const container = document.getElementById('affection-display');
                container.innerHTML = getAllCharacters().filter(char =>
                    gameState.metCharacters.includes(char.id) || char.affection > 0
                ).map(char =>
                    `<div class="affection-item">
                        <span class="heart" style="color: ${char.color}">❤️</span>
                        <span>${char.name.split('')[0]}</span>
                        <span>${'★'.repeat(Math.floor(char.affection / 20))}${'☆'.repeat(5 - Math.floor(char.affection / 20))}</span>
                    </div>`
                ).join('');
            }

            renderSaveSlots() {
                const container = document.getElementById('save-slots');
                const slots = saveSystem.getAllSlots();

                container.innerHTML = slots.map(slot => {
                    if (slot.info) {
                        return `<div class="save-card" onclick="game.handleSaveSlotClick(${slot.index})">
                            <div class="save-title">💾 存档 ${slot.index + 1}</div>
                            <div class="save-info">${slot.info.formattedTime}</div>
                            <div class="save-info">第${slot.info.chapter}章</div>
                            <div class="save-info">${slot.info.playerName} (${slot.info.playerMbti})</div>
                        </div>`;
                    } else {
                        return `<div class="save-card empty" onclick="game.handleSaveSlotClick(${slot.index})">
                            <div class="save-title">📭 空槽位 ${slot.index + 1}</div>
                            <div class="save-info">点击${this.saveMode === 'save' ? '保存' : '读取'}</div>
                        </div>`;
                    }
                }).join('');
            }

            handleSaveSlotClick(slotIndex) {
                if (this.saveMode === 'save') {
                    saveSystem.save(slotIndex, gameState.export());
                    alert('✅ 存档成功！');
                    this.showPage('game-page');
                } else {
                    const success = this.loadGame(slotIndex);
                    if (!success) alert('该槽位没有存档');
                }
            }

            loadGame(slotIndex) {
                const state = saveSystem.load(slotIndex);
                if (state) {
                    gameState.import(state);
                    this.startStory(state.currentStoryId);
                    this.checkSaves();
                    return true;
                }
                return false;
            }
        }

        // 初始化游戏
        const game = new GameEngine();
    </script>
</body>
</html>
