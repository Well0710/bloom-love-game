<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bloom - 百合恋爱互动游戏</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            height: 100vh;
            width: 100vw;
            padding: calc(20px + env(safe-area-inset-top)) 15px calc(20px + env(safe-area-inset-bottom));
            animation: fadeIn 0.4s ease;
            overflow: hidden;
        }

        .page.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 首页 ===== */
        #home-page {
            justify-content: flex-start;
            align-items: center;
            padding-top: calc(40px + env(safe-area-inset-top));
        }

        .home-top {
            text-align: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .game-logo {
            font-size: 3.5rem;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .game-title {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .game-subtitle {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
        }

        .home-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 320px;
            min-height: 0;
        }

        .feature-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .feature-card h3 {
            color: #fff;
            font-size: 1rem;
            margin-bottom: 12px;
            text-align: center;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .feature-item {
            background: rgba(255,255,255,0.25);
            padding: 10px 6px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
        }

        .feature-item .icon {
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .feature-item .text {
            font-size: 0.7rem;
            line-height: 1.2;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            flex-shrink: 0;
        }

        .btn {
            padding: 14px 28px;
            font-size: 0.95rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff !important;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.25);
            color: #fff !important;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== 角色创建页 ===== */
        #create-page {
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .create-container {
            width: 95%;
            max-width: 320px;
            background: rgba(255,255,255,0.98);
            border-radius: 20px;
            padding: 20px 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin: 10px 0;
            flex-shrink: 0;
        }

        .page-title {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            font-size: 0.95rem;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            transition: all 0.3s;
            font-family: inherit;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .mbti-section {
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f2ff 100%);
            padding: 15px;
            border-radius: 15px;
            margin-top: 10px;
        }

        .mbti-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            flex: 1;
            padding: 10px 15px;
            font-size: 0.85rem;
            border: 2px solid #667eea;
            border-radius: 25px;
            background: #fff;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: 600;
        }

        .btn-small:hover {
            background: #667eea;
            color: #fff;
        }

        .mbti-result {
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-top: 12px;
            color: #333;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .mbti-type-btn {
            padding: 8px 5px;
            font-size: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #fff;
            color: #555;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: 500;
        }

        .mbti-type-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .mbti-type-btn.selected {
            background: #667eea;
            color: #fff;
            border-color: #667eea;
        }

        .create-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        /* ===== MBTI 测试页 ===== */
        #test-page {
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .test-container {
            width: 95%;
            max-width: 320px;
            background: rgba(255,255,255,0.98);
            border-radius: 20px;
            padding: 20px 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            position: relative;
            flex-shrink: 0;
            margin-top: 10px;
        }

        .btn-back {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 8px 15px;
            font-size: 0.8rem;
            border: 2px solid rgba(102,126,234,0.3);
            border-radius: 20px;
            background: rgba(102,126,234,0.1);
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: 600;
        }

        .btn-back:hover {
            background: rgba(102,126,234,0.2);
        }

        .test-progress {
            text-align: center;
            margin-bottom: 15px;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e8e8e8;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .question-card {
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            padding: 20px;
            border-radius: 18px;
            font-size: 1rem;
            color: #333;
            text-align: center;
            line-height: 1.7;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(102,126,234,0.1);
        }

        .test-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-btn {
            padding: 14px 18px;
            font-size: 0.9rem;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-align: left;
            font-weight: 500;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-color: #667eea;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-nav {
            flex: 1;
            padding: 12px 18px;
            font-size: 0.9rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn-prev {
            background: #dfe6ed;
            color: #333 !important;
        }

        .btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            color: #888 !important;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff !important;
        }

        .btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== 游戏主界面 ===== */
        #game-page {
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        .game-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: background 0.8s ease;
        }

        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: calc(15px + env(safe-area-inset-top)) 15px calc(15px + env(safe-area-inset-bottom));
            overflow: hidden;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .chapter-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .affection-bar {
            display: flex;
            gap: 6px;
        }

        .affection-item {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 4px 8px;
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .affection-item .heart {
            font-size: 0.9rem;
        }

        .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 0;
        }

        .dialogue-box {
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            max-height: 50vh;
            overflow-y: auto;
        }

        .speaker-name {
            font-size: 1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #e84393 0%, #fd79a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .dialogue-text {
            font-size: 0.9rem;
            color: #333;
            line-height: 1.7;
            min-height: 60px;
            margin-bottom: 12px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .choice-btn {
            padding: 12px 15px;
            font-size: 0.85rem;
            border: 2px solid #fd79a8;
            border-radius: 12px;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-align: left;
            font-weight: 500;
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
            color: #fff;
            transform: translateX(3px);
        }

        .game-footer {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px 0;
            margin-top: 10px;
            flex-shrink: 0;
        }

        .btn-icon {
            padding: 10px 18px;
            font-size: 0.8rem;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 25px;
            background: rgba(255,255,255,0.25);
            color: #fff !important;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            backdrop-filter: blur(10px);
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-icon:hover {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
        }

        /* ===== 存档页 ===== */
        #save-page {
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .save-container {
            width: 95%;
            max-width: 320px;
            background: rgba(255,255,255,0.98);
            border-radius: 20px;
            padding: 20px 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            flex-shrink: 0;
            margin-top: 10px;
        }

        .save-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .save-card {
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .save-card:hover {
            transform: translateY(-3px);
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102,126,234,0.2);
        }

        .save-card.empty {
            opacity: 0.6;
        }

        .save-title {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .save-info {
            font-size: 0.7rem;
            color: #888;
            margin: 3px 0;
        }

        /* ===== 响应式优化 ===== */
        @media (max-width: 380px) {
            .game-title {
                font-size: 2rem;
            }
            .game-logo {
                font-size: 3.5rem;
            }
            .feature-item .text {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div id="home-page" class="page active">
        <div class="home-top">
            <div class="game-logo">🌸</div>
            <h1 class="game-title">Bloom</h1>
            <p class="game-subtitle">一段关于爱与成长的故事</p>
        </div>

        <div class="home-content">
            <div class="feature-card">
                <h3>✨ 游戏特色</h3>
                <div class="feature-grid">
                    <div class="feature-item">
                        <div class="icon">💕</div>
                        <div class="text">5 位可攻略角色</div>
                    </div>
                    <div class="feature-item">
                        <div class="icon">🎭</div>
                        <div class="text">MBTI 人格测试</div>
                    </div>
                    <div class="feature-item">
                        <div class="icon">📖</div>
                        <div class="text">多分支剧情</div>
                    </div>
                    <div class="feature-item">
                        <div class="icon">🌈</div>
                        <div class="text">10+ 种结局</div>
                    </div>
                </div>
            </div>

            <div class="menu-buttons">
                <button class="btn btn-primary" onclick="game.goToCreate()">✨ 新的故事</button>
                <button class="btn btn-secondary" id="btn-continue-home" onclick="game.continueGame()" disabled>📖 继续游戏</button>
                <button class="btn btn-secondary" onclick="game.showSave('load')">📂 读取存档</button>
            </div>
        </div>
    </div>

    <!-- 角色创建页 -->
    <div id="create-page" class="page">
        <div class="create-container">
            <h2 class="page-title">创建你的角色</h2>

            <div class="form-group">
                <label>你的名字</label>
                <input type="text" id="player-name" placeholder="请输入名字" maxlength="10" oninput="game.checkCreateComplete()">
            </div>

            <div class="form-group">
                <label>年龄</label>
                <input type="number" id="player-age" placeholder="20-40" min="20" max="40" oninput="game.checkCreateComplete()">
            </div>

            <div class="form-group">
                <label>职业</label>
                <input type="text" id="player-job" placeholder="例如：设计师、程序员、作家..." maxlength="20" oninput="game.checkCreateComplete()">
            </div>

            <div class="form-group">
                <label>MBTI 人格</label>
                <div class="mbti-section">
                    <div class="mbti-buttons">
                        <button class="btn-small" onclick="game.showMBTIDirect()">直接选择</button>
                        <button class="btn-small" onclick="game.startMBTITest()">10 题测试</button>
                    </div>
                    <div id="mbti-result" class="mbti-result" style="display: none;"></div>
                    <div id="mbti-grid" class="mbti-grid" style="display: none;"></div>
                </div>
            </div>

            <div class="create-buttons">
                <button class="btn btn-primary" id="btn-start-game" onclick="game.createCharacter()" disabled style="width: 100%;">开始故事</button>
                <button class="btn btn-secondary" onclick="game.goHome()" style="width: 100%;">返回标题</button>
            </div>
        </div>
    </div>

    <!-- MBTI 测试页 -->
    <div id="test-page" class="page">
        <div class="test-container">
            <button class="btn-back" onclick="game.goToCreate()">← 返回</button>
            
            <h2 class="page-title" style="margin-top: 20px;">MBTI 人格测试</h2>

            <div class="test-progress">
                <div class="progress-text">问题 <span id="current-q">1</span> / 10</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 10%;"></div>
                </div>
            </div>

            <div class="question-card" id="test-question">
                加载中...
            </div>

            <div class="test-options" id="test-options">
                <!-- 选项动态生成 -->
            </div>

            <div class="nav-buttons">
                <button class="btn-nav btn-prev" id="btn-prev-q" onclick="game.prevQuestion()" disabled>上一题</button>
                <button class="btn-nav btn-next" id="btn-next-q" onclick="game.nextQuestion()" disabled>下一题</button>
            </div>
        </div>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-page" class="page">
        <div class="game-bg" id="game-background"></div>

        <div class="game-container">
            <div class="game-header">
                <span class="chapter-badge" id="chapter-title">第 1 章</span>
                <div class="affection-bar" id="affection-display"></div>
            </div>

            <div class="game-content">
                <div class="dialogue-box">
                    <div class="speaker-name" id="speaker-name"></div>
                    <div class="dialogue-text" id="dialogue-text"></div>
                    <div class="choices-container" id="choices-container"></div>
                </div>
            </div>

            <div class="game-footer">
                <button class="btn-icon" onclick="game.showSave('save')">💾 保存</button>
                <button class="btn-icon" onclick="game.showSave('load')">📂 读取</button>
                <button class="btn-icon" onclick="game.goHome()">🏠 标题</button>
            </div>
        </div>
    </div>

    <!-- 存档页 -->
    <div id="save-page" class="page">
        <div class="save-container">
            <h2 class="page-title" id="save-title">💾 保存进度</h2>

            <div class="save-grid" id="save-slots"></div>

        const SAVE_VERSION = '1.0';

        class SaveSystem {
            constructor() {
                this.storageKey = 'bloom_love_saves';
                this.saves = this.loadSaves();
            }

            loadSaves() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            save(slotIndex, gameState) {
                const saveData = {
                    version: SAVE_VERSION,
                    timestamp: Date.now(),
                    chapter: gameState.currentChapter,
                    playerName: gameState.player.name,
                    playerMbti: gameState.player.mbti,
                    storyProgress: gameState.currentStoryId,
                    characters: {}
                };
                Object.keys(CHARACTERS).forEach(key => {
                    if (key !== 'player') {
                        saveData.characters[key] = {
                            affection: CHARACTERS[key].affection,
                            met: gameState.metCharacters?.includes(key) || false
                        };
                    }
                });
                this.saves[slotIndex] = saveData;
                this.persist();
                return true;
            }

            load(slotIndex) {
                const saveData = this.saves[slotIndex];
                if (!saveData) return null;

                resetCharacterAffection();
                Object.keys(saveData.characters).forEach(key => {
                    if (CHARACTERS[key]) {
                        CHARACTERS[key].affection = saveData.characters[key].affection || 0;
                    }
                });

                return {
                    currentChapter: saveData.chapter,
                    currentStoryId: saveData.storyProgress,
                    player: { name: saveData.playerName, mbti: saveData.playerMbti },
                    metCharacters: Object.keys(saveData.characters).filter(key => saveData.characters[key].met)
                };
            }

            getSaveInfo(slotIndex) {
                const saveData = this.saves[slotIndex];
                if (!saveData) return null;

                const date = new Date(saveData.timestamp);
                const now = new Date();
                const diff = now - date;
                let formattedTime;
                if (diff < 24 * 60 * 60 * 1000 && date.getDate() === now.getDate()) {
                    formattedTime = `今天 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                } else if (diff < 48 * 60 * 60 * 1000) {
                    formattedTime = `昨天 ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                } else {
                    formattedTime = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
                }

                return {
                    exists: true,
                    timestamp: saveData.timestamp,
                    chapter: saveData.chapter,
                    playerName: saveData.playerName,
                    playerMbti: saveData.playerMbti,
                    formattedTime: formattedTime
                };
            }

            hasSaves() {
                return this.saves.some(save => save !== null && save !== undefined);
            }

            persist() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.saves));
                } catch (e) {}
            }

            getAllSlots() {
                const slots = [];
                for (let i = 0; i < MAX_SAVE_SLOTS; i++) {
                    slots.push({ index: i, info: this.getSaveInfo(i) });
                }
                return slots;
            }
        }

                };
                this.saveMode = 'save';
                this.init();
            }

            init() {
                this.checkSaves();
                this.showPage('home-page');
            }

            showPage(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById(pageId).classList.add('active');
            }

            checkSaves() {
                const btn = document.getElementById('btn-continue-home');
                if (btn) btn.disabled = !saveSystem.hasSaves();
            }

            goHome() {
                this.checkSaves();
                this.showPage('home-page');
            }

            goToCreate() {
                gameState.reset();
                this.showPage('create-page');
                this.checkCreateComplete();
            }

            showSave(mode) {
                this.saveMode = mode;
                document.getElementById('save-title').textContent = mode === 'save' ? '💾 保存进度' : '📂 读取存档';
                this.renderSaveSlots();
                this.showPage('save-page');
            }

            backToGame() {
                this.showPage('game-page');
            }

            continueGame() {
                const slots = saveSystem.getAllSlots();
                const latestSlot = slots.filter(s => s.info).sort((a, b) => b.info.timestamp - a.info.timestamp)[0];
                if (latestSlot) {
                    this.loadGame(latestSlot.index);
                }
            }

            checkCreateComplete() {
                const name = document.getElementById('player-name')?.value.trim();
                const age = document.getElementById('player-age')?.value;
                const job = document.getElementById('player-job')?.value.trim();
                const mbti = gameState.player.mbti;
                const btn = document.getElementById('btn-start-game');
                if (btn) btn.disabled = !(name && age && job && mbti);
            }

            showMBTIDirect() {
                const grid = document.getElementById('mbti-grid');
                const result = document.getElementById('mbti-result');
                grid.style.display = 'grid';
                result.style.display = 'none';

                grid.innerHTML = MBTI_TYPES.map(type =>
                    `<button class="mbti-type-btn" onclick="game.selectMBTI('${type}')">${type}</button>`
                ).join('');
            }

            selectMBTI(type) {
                gameState.player.mbti = type;
                document.querySelectorAll('.mbti-type-btn').forEach(btn => btn.classList.remove('selected'));
                event.target.classList.add('selected');

                document.getElementById('mbti-result').innerHTML = `✅ 已选择：<strong>${type}</strong> - ${MBTI_DESCRIPTIONS[type]}`;
                document.getElementById('mbti-result').style.display = 'block';
                document.getElementById('mbti-grid').style.display = 'none';
                this.checkCreateComplete();
            }

            startMBTITest() {
                this.mbtiTest.currentQuestion = 0;
                this.mbtiTest.scores = { E: 0, I: 0, N: 0, S: 0, T: 0, F: 0, J: 0, P: 0 };
                this.mbtiTest.answers = new Array(10).fill(null);
                this.showPage('test-page');
                this.showTestQuestion();
            }

            showTestQuestion() {
                const q = MBTI_QUESTIONS[this.mbtiTest.currentQuestion];
                document.getElementById('current-q').textContent = this.mbtiTest.currentQuestion + 1;
                document.getElementById('progress-fill').style.width = ((this.mbtiTest.currentQuestion + 1) * 10) + '%';
                document.getElementById('test-question').textContent = q.text;

                const optionsEl = document.getElementById('test-options');
                optionsEl.innerHTML = q.options.map((opt, idx) => {
                    const selected = this.mbtiTest.answers[this.mbtiTest.currentQuestion] === opt.type ? 'selected' : '';
                    return `<button class="option-btn ${selected}" onclick="game.selectOption('${opt.type}', ${idx})">${opt.text}</button>`;
                }).join('');

                this.updateNavButtons();
            }

            selectOption(type, optionIndex) {
                this.mbtiTest.answers[this.mbtiTest.currentQuestion] = type;

                document.querySelectorAll('.option-btn').forEach((btn, idx) => {
                    if (idx === optionIndex) {
                        btn.classList.add('selected');
                    } else {
                        btn.classList.remove('selected');
                    }
                });

                this.updateNavButtons();
            }

            updateNavButtons() {
                const prevBtn = document.getElementById('btn-prev-q');
                const nextBtn = document.getElementById('btn-next-q');

                if (prevBtn) {
                    prevBtn.disabled = (this.mbtiTest.currentQuestion === 0);
                }

                if (nextBtn) {
                    const hasAnswer = this.mbtiTest.answers[this.mbtiTest.currentQuestion] !== null;
                    nextBtn.disabled = !hasAnswer;

                    if (this.mbtiTest.currentQuestion >= MBTI_QUESTIONS.length - 1) {
                        nextBtn.textContent = '完成';
                    } else {
                        nextBtn.textContent = '下一题';
                    }
                }
            }

            prevQuestion() {
                if (this.mbtiTest.currentQuestion > 0) {
                    this.mbtiTest.currentQuestion--;
                    this.showTestQuestion();
                }
            }

            nextQuestion() {
                if (this.mbtiTest.currentQuestion >= MBTI_QUESTIONS.length - 1) {
                    this.finishMBTITest();
                } else {
                    this.mbtiTest.currentQuestion++;
                    this.showTestQuestion();
                }
            }

            finishMBTITest() {
                const scores = { E: 0, I: 0, N: 0, S: 0, T: 0, F: 0, J: 0, P: 0 };
                this.mbtiTest.answers.forEach(answer => {
                    if (answer) scores[answer]++;
                });

                const result = [
                    scores.E >= scores.I ? 'E' : 'I',
                    scores.N >= scores.S ? 'N' : 'S',
                    scores.T >= scores.F ? 'T' : 'F',
                    scores.J >= scores.P ? 'J' : 'P'
                ].join('');

                gameState.player.mbti = result;
                document.getElementById('mbti-result').innerHTML = `🎉 测试结果：<strong>${result}</strong> - ${MBTI_DESCRIPTIONS[result]}`;
                document.getElementById('mbti-result').style.display = 'block';
                this.showPage('create-page');
                this.checkCreateComplete();
            }

            createCharacter() {
                const name = document.getElementById('player-name').value.trim();
                const age = parseInt(document.getElementById('player-age').value);
                const job = document.getElementById('player-job').value.trim();
                const mbti = gameState.player.mbti;

                gameState.setPlayer(name, age, job, mbti);
                this.startStory('start');
            }

            startStory(storyId) {
                const story = STORIES[storyId];
                if (!story) {
                    console.error('剧情不存在:', storyId);
                    return;
                }

                this.currentStory = story;
                gameState.currentStoryId = storyId;
                gameState.currentChapter = story.chapter;

                this.showPage('game-page');
                this.renderStory(story);
            }

            renderStory(story) {
                document.getElementById('game-background').style.background = story.bg;
                document.getElementById('chapter-title').textContent = story.chapter > 0 ? `第${story.chapter}章 ${story.title || ''}` : story.title || '';

                const speakerEl = document.getElementById('speaker-name');
                if (story.speaker) {
                    speakerEl.textContent = story.speaker;
                    speakerEl.style.display = 'block';
                } else {
                    speakerEl.style.display = 'none';
                }

                this.updateAffectionDisplay();

                this.fullText = story.text;
                this.displayedText = '';
                this.isTyping = true;
                document.getElementById('dialogue-text').textContent = '';
                this.typeText(story.text);

                this.renderChoices(story.choices);
            }

            typeText(text) {
                if (!this.isTyping) return;
                const chars = text.split('');
                let index = 0;

                const type = () => {
                    if (index < chars.length && this.isTyping) {
                        this.displayedText += chars[index];
                        document.getElementById('dialogue-text').textContent = this.displayedText;
                        index++;
                        this.typingTimer = setTimeout(type, 40);
                    } else {
                        this.isTyping = false;
                    }
                };
                type();
            }

            renderChoices(choices) {
                const container = document.getElementById('choices-container');
                container.innerHTML = '';

                if (!choices || choices.length === 0) return;

                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.onclick = () => this.makeChoice(choice);
                    container.appendChild(btn);
                });
            }

            makeChoice(choice) {
                if (choice.affection) {
                    Object.keys(choice.affection).forEach(charId => {
                        changeAffection(charId, choice.affection[charId]);
                        gameState.markMet(charId);
                    });
                    this.updateAffectionDisplay();
                }

                if (choice.next) {
                    this.startStory(choice.next);
                }
            }

            updateAffectionDisplay() {
                const container = document.getElementById('affection-display');
                container.innerHTML = getAllCharacters().filter(char =>
                    gameState.metCharacters.includes(char.id) || char.affection > 0
                ).map(char =>
                    `<div class="affection-item">
                        <span class="heart" style="color: ${char.color}">❤️</span>
                        <span>${char.name.split('')[0]}</span>
                        <span>${'★'.repeat(Math.floor(char.affection / 20))}${'☆'.repeat(5 - Math.floor(char.affection / 20))}</span>
                    </div>`
                ).join('');
            }

            renderSaveSlots() {
                const container = document.getElementById('save-slots');
                const slots = saveSystem.getAllSlots();

                container.innerHTML = slots.map(slot => {
                    if (slot.info) {
                        return `<div class="save-card" onclick="game.handleSaveSlotClick(${slot.index})">
                            <div class="save-title">💾 存档 ${slot.index + 1}</div>
                            <div class="save-info">${slot.info.formattedTime}</div>
                            <div class="save-info">第${slot.info.chapter}章</div>
                            <div class="save-info">${slot.info.playerName} (${slot.info.playerMbti})</div>
                        </div>`;
                    } else {
                        return `<div class="save-card empty" onclick="game.handleSaveSlotClick(${slot.index})">
                            <div class="save-title">📭 空槽位 ${slot.index + 1}</div>
                            <div class="save-info">点击${this.saveMode === 'save' ? '保存' : '读取'}</div>
                        </div>`;
                    }
                }).join('');
            }

            handleSaveSlotClick(slotIndex) {
                if (this.saveMode === 'save') {
                    saveSystem.save(slotIndex, gameState.export());
                    alert('✅ 存档成功！');
                    this.showPage('game-page');
                } else {
                    const success = this.loadGame(slotIndex);
                    if (!success) alert('该槽位没有存档');
                }
            }

            loadGame(slotIndex) {
                const state = saveSystem.load(slotIndex);
                if (state) {
                    gameState.import(state);
                    this.startStory(state.currentStoryId);
                    this.checkSaves();
                    return true;
                }
                return false;
            }
        }

        // 初始化游戏
        const game = new GameEngine();
    </script>
</body>
</html>
