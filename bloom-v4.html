<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Bloom - 上海生活记录</title>
    <style>
        /* ===== 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ===== 顶部状态栏 ===== */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-icon {
            font-size: 1rem;
        }

        .energy-bar {
            width: 100px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            transition: width 0.3s;
        }

        .energy-low .energy-fill {
            background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 100%);
        }

        /* ===== 页面容器 ===== */
        .page {
            display: none;
            min-height: 100vh;
            padding: calc(60px + env(safe-area-inset-top)) 15px calc(10px + env(safe-area-inset-bottom));
            animation: fadeIn 0.4s ease;
        }

        .page.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 首页 ===== */
        #home-page {
            justify-content: space-between;
            align-items: center;
        }

        .home-top {
            text-align: center;
            margin-top: 20px;
        }

        .game-logo {
            font-size: 4rem;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .game-title {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            font-weight: bold;
            letter-spacing: 3px;
        }

        .game-subtitle {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
        }

        .home-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            max-width: 320px;
        }

        .feature-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .feature-card h3 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .feature-item {
            background: rgba(255,255,255,0.25);
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
            color: #fff;
        }

        .feature-item .icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .feature-item .text {
            font-size: 0.75rem;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn {
            padding: 16px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.25);
            color: #fff;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255,255,255,0.35);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 角色卡片 ===== */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin: 20px 0;
        }

        .character-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .character-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .character-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .character-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .character-name {
            font-size: 0.95rem;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 5px;
        }

        .character-relation {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            margin-bottom: 8px;
        }

        .character-affection {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .character-affection-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            transition: width 0.3s;
        }

        .character-days {
            font-size: 0.7rem;
            color: #999;
            text-align: center;
            margin-top: 5px;
        }

        /* ===== 警告提示 ===== */
        .warning-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,65,108,0.95);
            color: #fff;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 2000;
            display: none;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== 成就通知 ===== */
        .achievement-toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(102,126,234,0.95);
            color: #fff;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 0.9rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 2000;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 380px) {
            .game-title {
                font-size: 2rem;
            }
            .game-logo {
                font-size: 3.5rem;
            }
            .character-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部状态栏 -->
    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">📅</span>
            <span>Day <span id="day-display">1</span>/365</span>
        </div>
        <div class="status-item">
            <span class="status-icon">⚡</span>
            <div class="energy-bar" id="energy-bar">
                <div class="energy-fill" id="energy-fill" style="width: 100%;"></div>
            </div>
            <span id="energy-display">100</span>
        </div>
        <div class="status-item">
            <span class="status-icon">💼</span>
            <span id="work-display">0%</span>
        </div>
    </div>

    <!-- 首页 -->
    <div id="home-page" class="page active">
        <div class="home-top">
            <div class="game-logo">🌸</div>
            <h1 class="game-title">Bloom</h1>
            <p class="game-subtitle">上海生活记录 · 365 天的恋爱故事</p>
        </div>

        <div class="home-content">
            <div class="feature-card">
                <h3>✨ 游戏特色</h3>
                <div class="feature-grid">
                    <div class="feature-item">
                        <div class="icon">📅</div>
                        <div class="text">365 天轮回</div>
                    </div>
                    <div class="feature-item">
                        <div class="icon">⚡</div>
                        <div class="text">精力管理</div>
                    </div>
                    <div class="feature-item">
                        <div class="icon">💕</div>
                        <div class="text">5 位可攻略</div>
                    </div>
                    <div class="feature-item">
                        <div class="icon">🏆</div>
                        <div class="text">75 个成就</div>
                    </div>
                </div>
            </div>

            <div class="menu-buttons">
                <button class="btn btn-primary" onclick="game.startNewGame()">✨ 新的故事</button>
                <button class="btn btn-secondary" id="btn-continue" onclick="game.continueGame()" disabled>📖 继续游戏</button>
                <button class="btn btn-secondary" onclick="game.showAchievements()">🏆 成就</button>
            </div>
        </div>
    </div>

    <!-- 警告提示 -->
    <div class="warning-toast" id="warning-toast"></div>

    <!-- 成就通知 -->
    <div class="achievement-toast" id="achievement-toast"></div>

    <script>
        // ===== 游戏常量 =====
        const MAX_DAY = 365;
        const MAX_ENERGY = 100;
        const WORK_HOURS_PER_DAY = 8;

        // ===== 角色数据 =====
        const CHARACTERS = {
            wenya: {
                id: 'wenya',
                name: '温雅',
                avatar: '🎨',
                color: '#fd79a8',
                affection: 0,
                maxAffection: 150,
                relation: 'stranger', // stranger, acquaintance, friend, ambiguous, lover, hotlove, partner, spouse
                lastContact: 0,
                unlocked: false
            },
            xiayang: {
                id: 'xiayang',
                name: '夏阳',
                avatar: '🏃',
                color: '#e67e22',
                affection: 0,
                maxAffection: 150,
                relation: 'stranger',
                lastContact: 0,
                unlocked: false
            },
            sujingyi: {
                id: 'sujingyi',
                name: '苏静怡',
                avatar: '🩺',
                color: '#3498db',
                affection: 0,
                maxAffection: 150,
                relation: 'stranger',
                lastContact: 0,
                unlocked: false
            },
            luxiao: {
                id: 'luxiao',
                name: '陆潇',
                avatar: '🍷',
                color: '#2d3436',
                affection: 0,
                maxAffection: 150,
                relation: 'stranger',
                lastContact: 0,
                unlocked: false
            },
            linwanqing: {
                id: 'linwanqing',
                name: '林婉清',
                avatar: '💼',
                color: '#8e44ad',
                affection: 0,
                maxAffection: 150,
                relation: 'stranger',
                lastContact: 0,
                unlocked: false
            }
        };

        // ===== 关系阶段定义 =====
        const RELATION_STAGES = {
            stranger: { name: '陌生人', minAffection: 0 },
            acquaintance: { name: '认识', minAffection: 20 },
            friend: { name: '朋友', minAffection: 40 },
            ambiguous: { name: '暧昧', minAffection: 60 },
            lover: { name: '恋人', minAffection: 86 },
            hotlove: { name: '热恋', minAffection: 101 },
            partner: { name: '伴侣', minAffection: 121 },
            spouse: { name: '夫妻', minAffection: 141 }
        };

        // ===== 联系频率阈值（天） =====
        const CONTACT_THRESHOLDS = {
            stranger: 999,
            acquaintance: 30,
            friend: 14,
            ambiguous: 7,
            lover: 3,
            hotlove: 2,
            partner: 2,
            spouse: 1
        };

        // ===== 游戏状态 =====
        class GameState {
            constructor() {
                this.day = 1;
                this.energy = MAX_ENERGY;
                this.workProgress = 0;
                this.achievements = [];
                this.flags = {};
            }

            reset() {
                this.day = 1;
                this.energy = MAX_ENERGY;
                this.workProgress = 0;
                this.flags = {};
                
                Object.keys(CHARACTERS).forEach(key => {
                    CHARACTERS[key].affection = 0;
                    CHARACTERS[key].relation = 'stranger';
                    CHARACTERS[key].lastContact = 0;
                    CHARACTERS[key].unlocked = false;
                });
            }

            save() {
                const saveData = {
                    day: this.day,
                    energy: this.energy,
                    workProgress: this.workProgress,
                    achievements: this.achievements,
                    flags: this.flags,
                    characters: {}
                };

                Object.keys(CHARACTERS).forEach(key => {
                    saveData.characters[key] = {
                        affection: CHARACTERS[key].affection,
                        relation: CHARACTERS[key].relation,
                        lastContact: CHARACTERS[key].lastContact,
                        unlocked: CHARACTERS[key].unlocked
                    };
                });

                localStorage.setItem('bloom_save', JSON.stringify(saveData));
            }

            load() {
                const saveData = localStorage.getItem('bloom_save');
                if (!saveData) return false;

                const data = JSON.parse(saveData);
                this.day = data.day;
                this.energy = data.energy;
                this.workProgress = data.workProgress;
                this.achievements = data.achievements || [];
                this.flags = data.flags || {};

                if (data.characters) {
                    Object.keys(data.characters).forEach(key => {
                        if (CHARACTERS[key]) {
                            CHARACTERS[key].affection = data.characters[key].affection;
                            CHARACTERS[key].relation = data.characters[key].relation;
                            CHARACTERS[key].lastContact = data.characters[key].lastContact;
                            CHARACTERS[key].unlocked = data.characters[key].unlocked;
                        }
                    });
                }

                return true;
            }

            hasSave() {
                return localStorage.getItem('bloom_save') !== null;
            }
        }

        const gameState = new GameState();

        // ===== 游戏引擎 =====
        class GameEngine {
            constructor() {
                this.init();
            }

            init() {
                this.updateStatusBar();
                this.checkContinueButton();
            }

            updateStatusBar() {
                document.getElementById('day-display').textContent = gameState.day;
                document.getElementById('energy-display').textContent = gameState.energy;
                document.getElementById('energy-fill').style.width = gameState.energy + '%';
                document.getElementById('work-display').textContent = gameState.workProgress + '%';

                const energyBar = document.getElementById('energy-bar');
                if (gameState.energy < 30) {
                    energyBar.classList.add('energy-low');
                } else {
                    energyBar.classList.remove('energy-low');
                }
            }

            checkContinueButton() {
                const btn = document.getElementById('btn-continue');
                if (btn) {
                    btn.disabled = !gameState.hasSave();
                }
            }

            startNewGame() {
                if (confirm('确定要开始新游戏吗？当前进度将会丢失。')) {
                    gameState.reset();
                    this.updateStatusBar();
                    alert('游戏开始！你来到了上海，外派期 365 天。\n\n好好把握这段时间吧！');
                }
            }

            continueGame() {
                if (gameState.load()) {
                    this.updateStatusBar();
                    alert('游戏继续！今天是第 ' + gameState.day + ' 天。');
                }
            }

            showAchievements() {
                alert('成就系统开发中...\n\n当前解锁：' + gameState.achievements.length + '/75');
            }

            showWarning(message) {
                const toast = document.getElementById('warning-toast');
                toast.textContent = message;
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 3000);
            }

            showAchievement(name) {
                const toast = document.getElementById('achievement-toast');
                toast.innerHTML = '🏆 成就解锁<br><strong>' + name + '</strong>';
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 3000);
            }

            changeAffection(characterId, amount) {
                if (!CHARACTERS[characterId]) return;

                const oldAffection = CHARACTERS[characterId].affection;
                CHARACTERS[characterId].affection = Math.max(0, Math.min(150, CHARACTERS[characterId].affection + amount));

                // 检查关系阶段变化
                const newRelation = this.getRelationStage(CHARACTERS[characterId].affection);
                if (newRelation !== CHARACTERS[characterId].relation) {
                    const oldStage = RELATION_STAGES[CHARACTERS[characterId].relation].name;
                    const newStage = RELATION_STAGES[newRelation].name;
                    CHARACTERS[characterId].relation = newRelation;
                    this.showWarning(CHARACTERS[characterId].name + ' 和你们关系升级为：' + newStage);
                }

                // 检查成就
                if (oldAffection < 86 && CHARACTERS[characterId].affection >= 86) {
                    this.showAchievement('【' + CHARACTERS[characterId].name + '·恋人未满】');
                }
                if (oldAffection < 150 && CHARACTERS[characterId].affection >= 150) {
                    this.showAchievement('【' + CHARACTERS[characterId].name + '·真爱无敌】');
                }
            }

            getRelationStage(affection) {
                if (affection >= 141) return 'spouse';
                if (affection >= 121) return 'partner';
                if (affection >= 101) return 'hotlove';
                if (affection >= 86) return 'lover';
                if (affection >= 60) return 'ambiguous';
                if (affection >= 40) return 'friend';
                if (affection >= 20) return 'acquaintance';
                return 'stranger';
            }

            checkContactOverdue() {
                // 检查太久没联系的角色
                Object.keys(CHARACTERS).forEach(key => {
                    const char = CHARACTERS[key];
                    if (!char.unlocked || char.relation === 'stranger') return;

                    const daysSinceContact = gameState.day - char.lastContact;
                    const threshold = CONTACT_THRESHOLDS[char.relation];

                    if (daysSinceContact > threshold) {
                        // 好感度下降
                        this.changeAffection(key, -5);
                        this.showWarning(char.name + ' 已经 ' + daysSinceContact + ' 天没联系了，她有点生气...');

                        // 检查是否分手
                        if (daysSinceContact > threshold * 2 && char.relation === 'lover') {
                            this.showWarning(char.name + ' 向你提出了分手...');
                            // TODO: 触发分手事件
                        }
                    }
                });
            }

            nextDay() {
                gameState.day++;
                gameState.energy = Math.min(MAX_ENERGY, gameState.energy + 50); // 睡觉恢复
                gameState.workProgress = 0; // 重置工作进度

                if (gameState.day > MAX_DAY) {
                    this.triggerEnding();
                    return;
                }

                this.checkContactOverdue();
                this.updateStatusBar();
                this.showWarning('第 ' + gameState.day + ' 天开始了！');
            }

            triggerEnding() {
                // TODO: 触发结局
                alert('365 天外派期结束了！\n\n根据你的选择，将触发不同的结局。\n\n（结局系统开发中）');
            }
        }

        // 初始化游戏
        const game = new GameEngine();
    </script>
</body>
</html>
