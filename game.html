<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bloom - 60天恋爱故事</title>
    <style>
        /* ===== CSS变量定义（恋与深空风格） ===== */
        :root {
            --bg-deep: #0d0d1a;
            --bg-deep-purple: #12102b;
            --bg-night: #1a0a2e;
            --gradient-primary: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            --gradient-secondary: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            --gradient-warm: linear-gradient(135deg, #fb923c 0%, #f472b6 100%);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --shadow-glow-purple: 0 0 30px rgba(168, 85, 247, 0.3);
            --shadow-glow-pink: 0 0 30px rgba(236, 72, 153, 0.3);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
            /* 角色专属色 */
            --char-wenya: #c084fc;
            --char-xiayang: #fb923c;
            --char-sujingyi: #34d399;
            --char-luxiao: #f43f5e;
            --char-linwanqing: #60a5fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: var(--bg-deep);
            background: radial-gradient(ellipse at bottom, var(--bg-night) 0%, var(--bg-deep) 50%, #05050a 100%);
            height: 100vh; overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            color: #fff;
        }

        /* ===== 星空粒子背景 ===== */
        #starry-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .stars-layer-1 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8) 1px, transparent 1px),
                radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,0.6) 1px, transparent 1px),
                radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.9) 1px, transparent 1px),
                radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.7) 1px, transparent 1px),
                radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.5) 1px, transparent 1px),
                radial-gradient(1.5px 1.5px at 15% 70%, rgba(255,255,255,0.8) 1px, transparent 1px),
                radial-gradient(1px 1px at 45% 80%, rgba(255,255,255,0.6) 1px, transparent 1px),
                radial-gradient(1px 1px at 85% 85%, rgba(255,255,255,0.7) 1px, transparent 1px),
                radial-gradient(1.5px 1.5px at 25% 55%, rgba(255,255,255,0.5) 1px, transparent 1px),
                radial-gradient(1px 1px at 65% 25%, rgba(255,255,255,0.8) 1px, transparent 1px);
            background-size: 200px 200px;
            animation: twinkle 4s ease-in-out infinite;
        }
        .stars-layer-2 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                radial-gradient(2px 2px at 20% 15%, rgba(168, 85, 247, 0.9) 2px, transparent 2px),
                radial-gradient(2px 2px at 55% 35%, rgba(236, 72, 153, 0.8) 2px, transparent 2px),
                radial-gradient(2px 2px at 80% 55%, rgba(168, 85, 247, 0.7) 2px, transparent 2px),
                radial-gradient(2.5px 2.5px at 35% 75%, rgba(236, 72, 153, 0.9) 2px, transparent 2px),
                radial-gradient(2px 2px at 95% 45%, rgba(168, 85, 247, 0.6) 2px, transparent 2px);
            background-size: 300px 300px;
            animation: twinkle 6s ease-in-out infinite;
        }
        .stars-layer-3 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                radial-gradient(3px 3px at 12% 42%, rgba(255,255,255,1) 3px, transparent 3px),
                radial-gradient(3px 3px at 38% 18%, rgba(255,255,255,0.9) 3px, transparent 3px),
                radial-gradient(3px 3px at 68% 62%, rgba(255,255,255,1) 3px, transparent 3px),
                radial-gradient(3px 3px at 88% 78%, rgba(255,255,255,0.8) 3px, transparent 3px),
                radial-gradient(2.5px 2.5px at 52% 88%, rgba(255,255,255,0.9) 2px, transparent 2px);
            background-size: 400px 400px;
            animation: twinkle 8s ease-in-out infinite;
        }
        .shooting-star {
            position: absolute; width: 100px; height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
            opacity: 0; animation: shooting 3s ease-in-out infinite;
        }
        .shooting-star:nth-child(4) { top: 20%; left: 10%; animation-delay: 0s; }
        .shooting-star:nth-child(5) { top: 40%; left: 60%; animation-delay: 1.5s; }
        .shooting-star:nth-child(6) { top: 15%; left: 80%; animation-delay: 2.5s; }
        @keyframes twinkle { 0%,100%{opacity:0.7} 50%{opacity:1} }
        @keyframes shooting { 0%{opacity:0;transform:translateX(0) translateY(0)} 10%{opacity:1} 30%{opacity:0;transform:translateX(150px) translateY(50px)} 100%{opacity:0} }
        @keyframes titleGlow { 0%,100%{filter:drop-shadow(0 0 10px rgba(168,85,247,0.5))} 50%{filter:drop-shadow(0 0 25px rgba(236,72,153,0.7))} }

        /* ===== 顶部状态栏 ===== */
        .status-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }
        .status-left { display: flex; align-items: center; gap: 12px; }
        .status-day { font-size: 0.85rem; font-weight: 700; color: #e2e2e2; }
        .status-day-label { font-size: 0.6rem; color: #aaa; }
        .status-right { display: flex; align-items: center; gap: 8px; }
        .action-points { display: flex; gap: 4px; align-items: center; }
        .action-dot {
            width: 10px; height: 10px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            transition: all var(--transition-normal);
        }
        .action-dot.used { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.2); }
        .action-dot.available { background: #a855f7; border-color: #a855f7; box-shadow: 0 0 6px rgba(168,85,247,0.6); }

        /* ===== 页面容器 ===== */
        .page { display: none; height: 100vh; flex-direction: column; position: relative; z-index: 1; }
        .page.active { display: flex; }

        /* ===== 首页 ===== */
        #home-page { justify-content: center; align-items: center; background: transparent; }
        .home-logo { text-align: center; margin-bottom: 32px; }
        .home-logo .bloom-icon { font-size: 4rem; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .home-logo h1 {
            font-size: 2.2rem; font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            animation: titleGlow 3s ease-in-out infinite;
        }
        .home-logo p { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 4px; letter-spacing: 0.3em; }
        .home-card {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 24px 20px; margin: 0 20px; width: 100%; max-width: 340px;
            box-shadow: var(--shadow-soft);
            transition: all var(--transition-normal);
        }
        .home-tags { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .home-tag { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 4px 12px; font-size: 0.7rem; color: rgba(255,255,255,0.7); }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 14px;
            font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit;
            transition: all var(--transition-normal); position: relative; overflow: hidden;
        }
        .btn-primary {
            background: var(--gradient-primary); color: #fff;
            box-shadow: var(--shadow-glow-purple);
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); margin-top: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ===== 角色创建页 ===== */
        #create-page { justify-content: flex-start; align-items: center; padding: 70px 20px 20px; background: transparent; overflow-y: auto; }
        .create-title {
            font-size: 1.4rem; font-weight: 300; text-align: center; margin-bottom: 24px; color: #fff;
            background: var(--gradient-primary); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            letter-spacing: 0.1em;
        }
        .create-subtitle { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-align: center; margin-top: 4px; margin-bottom: 20px; }
        .create-section { width: 100%; max-width: 340px; margin-bottom: 20px; }
        .create-label { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
        .create-input {
            width: 100%; padding: 14px 20px; border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg); color: #fff; font-size: 0.9rem; font-family: inherit;
            outline: none; transition: all var(--transition-normal);
            backdrop-filter: blur(10px);
        }
        .create-input:focus { border-color: #a855f7; box-shadow: 0 0 20px rgba(168,85,247,0.3); }
        .create-input::placeholder { color: rgba(255,255,255,0.3); }

        /* MBTI选择卡片 */
        .mbti-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .mbti-card {
            background: var(--glass-bg); border: 2px solid var(--glass-border);
            border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer;
            transition: all var(--transition-normal); font-size: 0.7rem; color: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
        }
        .mbti-card:hover { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.12); }
        .mbti-card.selected { border-color: #a855f7; background: var(--gradient-primary); color: #fff; box-shadow: var(--shadow-glow-purple); }
        .mbti-card .mbti-type { font-size: 0.8rem; font-weight: 700; margin-bottom: 2px; }

        /* MBTI测试题 */
        .mbti-test { display: none; }
        .mbti-question { background: var(--glass-bg); border-radius: 16px; padding: 20px; margin-bottom: 12px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
        .mbti-q-num { font-size: 0.7rem; color: #a855f7; font-weight: 700; margin-bottom: 8px; }
        .mbti-q-text { font-size: 0.85rem; color: #fff; margin-bottom: 14px; line-height: 1.5; }
        .mbti-opt { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--glass-border); background: var(--glass-bg); color: rgba(255,255,255,0.7); font-size: 0.8rem; font-family: inherit; cursor: pointer; text-align: left; margin-bottom: 6px; transition: all var(--transition-normal); }
        .mbti-opt:hover { border-color: #a855f7; color: #fff; transform: translateX(5px); }
        .mbti-opt.selected { border-color: #a855f7; background: rgba(168,85,247,0.2); color: #fff; }
        .mbti-nav { display: flex; gap: 8px; margin-top: 16px; }
        .mbti-nav .btn { flex: 1; }
        .btn-back { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .mbti-result { display: none; text-align: center; padding: 20px; background: rgba(168,85,247,0.15); border-radius: 16px; border: 2px solid #a855f7; }
        .mbti-result-type { font-size: 2rem; font-weight: 800; color: #a855f7; margin-bottom: 8px; }
        .mbti-result-name { font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
        .mbti-result-desc { font-size: 0.75rem; color: rgba(255,255,255,0.5); line-height: 1.5; }

        /* ===== 开场5人亮相 ===== */
        #intro-page { justify-content: center; align-items: center; padding: 60px 16px 20px; background: transparent; overflow-y: auto; }
        .intro-title { font-size: 1.2rem; font-weight: 800; text-align: center; margin-bottom: 6px; }
        .intro-sub { font-size: 0.7rem; color: rgba(255,255,255,0.4); text-align: center; margin-bottom: 20px; }
        .intro-cards { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
        .intro-card {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border); border-radius: 16px; padding: 14px 16px;
            cursor: pointer; transition: all var(--transition-normal); display: flex; align-items: center; gap: 12px;
            opacity: 0; transform: translateY(20px);
        }
        .intro-card.show { opacity: 1; transform: translateY(0); animation: slideInUp 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
        .intro-card:hover { border-color: var(--glass-highlight); transform: translateX(4px); background: rgba(255,255,255,0.12); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
        .intro-card:active { transform: scale(0.98); }
        .intro-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .intro-info { flex: 1; min-width: 0; }
        .intro-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; }
        .intro-meta { font-size: 0.65rem; color: rgba(255,255,255,0.5); margin-bottom: 3px; }
        .intro-mbti { display: inline-block; background: rgba(168,85,247,0.2); border-radius: 6px; padding: 1px 6px; font-size: 0.6rem; color: #a855f7; }
        .intro-quote { font-size: 0.7rem; color: rgba(255,255,255,0.4); font-style: italic; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .intro-arrow { color: rgba(255,255,255,0.3); font-size: 1rem; }

        /* ===== 游戏主页面 ===== */
        #game-page { padding: 60px 12px 80px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .day-theme { text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-bottom: 2px; }

        /* 已认识的人横条 */
        .known-bar-label { font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-bottom: 8px; font-weight: 600; }
        .chars-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .char-mini {
            flex-shrink: 0; width: 56px; background: var(--glass-bg); border-radius: 14px;
            padding: 8px 4px; text-align: center; cursor: pointer; border: 2px solid transparent;
            transition: all var(--transition-normal); position: relative;
            backdrop-filter: blur(10px);
        }
        .char-mini:hover { background: rgba(255,255,255,0.14); border-color: var(--glass-highlight); transform: translateY(-2px); }
        .char-mini.glow { border-color: rgba(168,85,247,0.5); box-shadow: 0 0 15px rgba(168,85,247,0.3); }
        .char-mini-icon { font-size: 1.3rem; margin-bottom: 3px; }
        .char-mini-name { font-size: 0.6rem; font-weight: 700; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .char-mini-bar { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .char-mini-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
        .char-badge { position: absolute; top: -4px; right: -4px; font-size: 0.5rem; background: #f43f5e; border-radius: 6px; padding: 1px 4px; color: #fff; font-weight: 700; }

        /* 活动选择区 */
        .activity-section { background: var(--glass-bg); border-radius: 20px; padding: 16px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
        .activity-label { font-size: 0.85rem; font-weight: 700; margin-bottom: 12px; color: rgba(255,255,255,0.9); }
        .action-remain { font-size: 0.65rem; font-weight: 400; color: rgba(255,255,255,0.4); margin-left: 8px; }
        .activity-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .activity-btn {
            background: var(--glass-bg); border: 1.5px solid var(--glass-border);
            border-radius: 16px; padding: 14px 10px; color: #fff; cursor: pointer;
            font-family: inherit; text-align: center; transition: all var(--transition-normal);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .activity-btn::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--gradient-primary); opacity: 0.8;
        }
        .activity-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0,0,0,0.35); border-color: var(--glass-highlight); }
        .activity-btn:active { transform: scale(0.96); }
        .activity-btn.used { opacity: 0.35; cursor: not-allowed; }
        .activity-btn.unlocked-glow { border-color: rgba(168,85,247,0.5); background: rgba(168,85,247,0.1); box-shadow: 0 0 20px rgba(168,85,247,0.2); }
        .activity-icon { font-size: 1.6rem; }
        .activity-name { font-size: 0.8rem; font-weight: 700; }
        .activity-hint { font-size: 0.6rem; color: rgba(255,255,255,0.4); line-height: 1.3; }
        .activity-count { position: absolute; top: 6px; right: 8px; font-size: 0.55rem; color: rgba(255,255,255,0.4); }
        .activity-known { position: absolute; top: 6px; left: 8px; font-size: 0.65rem; }

        /* 睡觉大按钮 */
        .sleep-big-btn {
            background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(236,72,153,0.2));
            border: 1px solid rgba(168,85,247,0.3); border-radius: 16px; padding: 16px;
            color: rgba(255,255,255,0.8); font-family: inherit; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all var(--transition-normal);
            backdrop-filter: blur(10px);
        }
        .sleep-big-btn:active { transform: scale(0.98); }

        /* 每日提示 */
        .daily-tip { font-size: 0.7rem; color: rgba(255,255,255,0.3); text-align: center; }

        /* ===== 联系界面 ===== */
        #contact-page { padding: 60px 12px 20px; overflow-y: auto; }
        .contact-list { display: flex; flex-direction: column; gap: 8px; }
        .contact-item {
            background: var(--glass-bg); border-radius: 14px; padding: 14px;
            border: 1px solid var(--glass-border); display: flex; align-items: center;
            gap: 12px; cursor: pointer; transition: all var(--transition-normal);
            backdrop-filter: blur(10px);
        }
        .contact-item:hover { background: rgba(255,255,255,0.12); border-color: var(--glass-highlight); transform: translateX(3px); }
        .contact-item:active { transform: scale(0.98); }
        .contact-item.disabled { opacity: 0.4; cursor: not-allowed; }
        .contact-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .contact-info { flex: 1; min-width: 0; }
        .contact-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
        .contact-tag { font-size: 0.55rem; background: rgba(168,85,247,0.3); border-radius: 6px; padding: 1px 5px; color: #a855f7; }
        .contact-tag.lover { background: rgba(236,72,153,0.4); color: #ec4899; }
        .contact-bar { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .contact-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
        .contact-mode { display: flex; gap: 6px; margin-left: auto; }
        .mode-btn { background: rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 10px; font-size: 0.65rem; color: rgba(255,255,255,0.7); cursor: pointer; border: none; font-family: inherit; }
        .mode-btn:active { background: rgba(255,255,255,0.2); }

        /* ===== 回顾关系页 ===== */
        #review-page { padding: 60px 16px 20px; overflow-y: auto; }
        .review-title { font-size: 1rem; font-weight: 700; text-align: center; margin-bottom: 16px; }
        .review-cards { display: flex; flex-direction: column; gap: 10px; }
        .review-card { background: var(--glass-bg); border-radius: 14px; padding: 14px; border: 1px solid var(--glass-border); backdrop-filter: blur(10px); transition: all var(--transition-normal); }
        .review-card:hover { background: rgba(255,255,255,0.12); border-color: var(--glass-highlight); }
        .review-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .review-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .review-name { font-size: 0.85rem; font-weight: 700; }
        .review-stage { font-size: 0.65rem; color: rgba(255,255,255,0.5); }
        .review-bar-wrap { background: rgba(255,255,255,0.1); border-radius: 4px; height: 6px; overflow: hidden; margin-bottom: 4px; }
        .review-bar { height: 100%; border-radius: 4px; transition: width 0.4s; }
        .review-num { font-size: 0.65rem; color: rgba(255,255,255,0.4); display: flex; justify-content: space-between; }

        /* ===== 对话遮罩 ===== */
        .dialogue-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 3000;
            display: none; justify-content: center; align-items: flex-end;
        }

<!-- ===== 脚本开始 ===== -->
<script>
// ===== BGM 音频系统（程序化合成，无需外部音频文件）=====
const BloomAudio = (function() {
  let audioContext = null;
  let masterGain = null;
  let currentBgm = null;
  let currentBgmNodes = [];
  let isInitialized = false;
  let isMuted = false;
  let fadeTime = 0.5;

  const NOTES = {
    C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
    C6: 1046.50,
    Cs3: 138.59, Ds3: 155.56, Fs3: 185.00, Gs3: 207.65, As3: 233.08,
    Cs4: 277.18, Ds4: 311.13, Fs4: 369.99, Gs4: 415.30, As4: 466.16,
    Cs5: 554.37, Ds5: 622.25, Fs5: 739.99, Gs5: 830.61, As5: 932.33,
  };

  function createOscillator(type, frequency, startTime, duration, volume) {
    if (!audioContext || isMuted) return null;
    volume = volume || 0.3;
    var osc = audioContext.createOscillator();
    var gain = audioContext.createGain();
    osc.type = type;
    osc.frequency.value = frequency;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.1);
    return { osc: osc, gain: gain };
  }

  function playPianoNote(freq, time, duration, vol) {
    if (!audioContext || isMuted) return;
    duration = duration || 1; vol = vol || 0.25;
    var osc1 = audioContext.createOscillator();
    var osc2 = audioContext.createOscillator();
    var gain = audioContext.createGain();
    var filter = audioContext.createBiquadFilter();
    osc1.type = 'sine'; osc2.type = 'triangle';
    osc1.frequency.value = freq; osc2.frequency.value = freq * 2;
    filter.type = 'lowpass'; filter.frequency.value = 2000;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.01);
    gain.gain.exponentialRampToValueAtTime(vol * 0.6, time + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
    osc1.connect(filter); osc2.connect(filter);
    filter.connect(gain); gain.connect(masterGain);
    osc1.start(time); osc2.start(time);
    osc1.stop(time + duration + 0.1); osc2.stop(time + duration + 0.1);
  }

  function playPadChord(frequencies, time, duration, vol) {
    if (!audioContext || isMuted) return;
    duration = duration || 4; vol = vol || 0.15;
    frequencies.forEach(function(freq) {
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();
      var filter = audioContext.createBiquadFilter();
      osc.type = 'sine'; osc.frequency.value = freq;
      filter.type = 'lowpass'; filter.frequency.value = 800;
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(vol, time + 0.3);
      gain.gain.setValueAtTime(vol, time + duration - 0.5);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
      osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
      osc.start(time); osc.stop(time + duration + 0.1);
    });
  }

  function playGuitarNote(freq, time, duration, vol) {
    if (!audioContext || isMuted) return;
    duration = duration || 0.8; vol = vol || 0.2;
    var harmonics = [1, 2, 3, 4, 5];
    var harmonicVols = [1, 0.5, 0.25, 0.125, 0.0625];
    harmonics.forEach(function(h, i) {
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();
      osc.type = i === 0 ? 'triangle' : 'sine';
      osc.frequency.value = freq * h;
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(vol * harmonicVols[i], time + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration * (1 - i * 0.15));
      osc.connect(gain); gain.connect(masterGain);
      osc.start(time); osc.stop(time + duration + 0.1);
    });
  }

  function playElectronicNote(freq, time, duration, vol) {
    if (!audioContext || isMuted) return;
    duration = duration || 0.3; vol = vol || 0.2;
    var osc = audioContext.createOscillator();
    var gain = audioContext.createGain();
    var filter = audioContext.createBiquadFilter();
    osc.type = 'sawtooth'; osc.frequency.value = freq;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2000, time);
    filter.frequency.exponentialRampToValueAtTime(200, time + duration);
    filter.Q.value = 5;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.01);
    gain.gain.setValueAtTime(vol * 0.8, time + duration * 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
    osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
    osc.start(time); osc.stop(time + duration + 0.1);
  }

  function playEnvelopeTone(freq, duration, attack, decay, sustain, release, type, vol) {
    if (!audioContext || isMuted) return;
    type = type || 'sine'; vol = vol || 0.3;
    var osc = audioContext.createOscillator();
    var gain = audioContext.createGain();
    osc.type = type; osc.frequency.value = freq;
    var now = audioContext.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol, now + attack);
    gain.gain.linearRampToValueAtTime(vol * sustain, now + attack + decay);
    gain.gain.setValueAtTime(vol * sustain, now + duration - release);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(now); osc.stop(now + duration + 0.1);
  }

  // ===== BGM 生成器 =====
  function startMenuBgm() {
    var bpm = 70, beatDuration = 60 / bpm, step = 0;
    function playStep() {
      if (!currentBgm || currentBgm !== 'menu') return;
      var time = audioContext.currentTime;
      if (step % 4 === 0) playPadChord([NOTES.C4, NOTES.E4, NOTES.G4], time, beatDuration * 3.8, 0.08);
      var melody = [NOTES.C5, NOTES.E5, NOTES.G5, NOTES.E5, NOTES.F5, NOTES.A5, NOTES.G5, NOTES.E5];
      playPianoNote(melody[step % 8], time, beatDuration * 0.9, 0.2);
      var bass = [NOTES.C3, NOTES.C3, NOTES.G3, NOTES.G3, NOTES.F3, NOTES.F3, NOTES.C4, NOTES.C4];
      playPianoNote(bass[step % 8], time, beatDuration * 0.8, 0.15);
      step++;
      currentBgmNodes.push(setTimeout(playStep, beatDuration * 1000));
    }
    playStep();
  }

  function startDailyBgm() {
    var bpm = 90, beatDuration = 60 / bpm, step = 0;
    function playStep() {
      if (!currentBgm || currentBgm !== 'daily') return;
      var time = audioContext.currentTime;
      var melody = [NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5, NOTES.D4, NOTES.F4, NOTES.A4, NOTES.D5,
                    NOTES.E4, NOTES.G4, NOTES.B4, NOTES.E5, NOTES.F4, NOTES.A4, NOTES.C5, NOTES.F5];
      playPianoNote(melody[step % 16], time, beatDuration * 0.7, 0.18);
      if (step % 2 === 0) {
        var chords = [[NOTES.C4,NOTES.E4,NOTES.G4],[NOTES.F4,NOTES.A4,NOTES.C5],[NOTES.G4,NOTES.B4,NOTES.D5],[NOTES.A4,NOTES.C5,NOTES.E5]];
        var ci = Math.floor(step / 2) % 4;
        playGuitarNote(chords[ci][0], time, beatDuration * 1.8, 0.12);
        playGuitarNote(chords[ci][1], time + 0.1, beatDuration * 1.6, 0.1);
        playGuitarNote(chords[ci][2], time + 0.2, beatDuration * 1.4, 0.08);
      }
      var bassArr = [NOTES.C3, NOTES.F3, NOTES.G3, NOTES.A3];
      if (step % 4 === 0) playPianoNote(bassArr[Math.floor(step / 4) % 4], time, beatDuration * 1.5, 0.15);
      step++;
      currentBgmNodes.push(setTimeout(playStep, beatDuration * 1000));
    }
    playStep();
  }

  function startRomanticBgm() {
    var bpm = 65, beatDuration = 60 / bpm, step = 0;
    function playStep() {
      if (!currentBgm || currentBgm !== 'romantic') return;
      var time = audioContext.currentTime;
      var melody = [NOTES.C5, NOTES.E5, NOTES.G5, NOTES.E5, NOTES.A4, NOTES.C5, NOTES.E5, NOTES.D5,
                    NOTES.B4, NOTES.D5, NOTES.F5, NOTES.E5, NOTES.G4, NOTES.B4, NOTES.D5, NOTES.C5];
      if (step % 2 === 0) {
        var chords = [[NOTES.C4,NOTES.E4,NOTES.G4,NOTES.B4],[NOTES.A3,NOTES.C4,NOTES.E4,NOTES.G4],
                      [NOTES.F3,NOTES.A3,NOTES.C4,NOTES.E4],[NOTES.G3,NOTES.B3,NOTES.D4,NOTES.G4]];
        playPadChord(chords[Math.floor(step / 2) % 4], time, beatDuration * 1.8, 0.12);
      }
      playPianoNote(melody[step % 16], time, beatDuration * 1.2, 0.22);
      step++;
      currentBgmNodes.push(setTimeout(playStep, beatDuration * 1000));
    }
    playStep();
  }

  function startTenseBgm() {
    var bpm = 110, beatDuration = 60 / bpm, step = 0;
    function playStep() {
      if (!currentBgm || currentBgm !== 'tense') return;
      var time = audioContext.currentTime;
      var motif = [NOTES.Cs4, NOTES.Ds4, NOTES.Fs4, NOTES.Gs4];
      playElectronicNote(motif[step % 4], time, beatDuration * 0.4, 0.2);
      if (step % 2 === 0) createOscillator('sawtooth', NOTES.Cs3, time, beatDuration * 0.8, 0.15);
      if (step % 2 === 1) createOscillator('square', 6000, time, 0.03, 0.08);
      step++;
      currentBgmNodes.push(setTimeout(playStep, beatDuration * 1000));
    }
    playStep();
  }

  function startEndingGoodBgm() {
    var bpm = 75, beatDuration = 60 / bpm, step = 0;
    function playStep() {
      if (!currentBgm || currentBgm !== 'ending_good') return;
      var time = audioContext.currentTime;
      var melody = [NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5, NOTES.D4, NOTES.F4, NOTES.A4, NOTES.D5,
                    NOTES.E4, NOTES.G4, NOTES.B4, NOTES.E5, NOTES.G4, NOTES.B4, NOTES.D5, NOTES.G5];
      if (step % 4 === 0) {
        var chords = [[NOTES.C4,NOTES.E4,NOTES.G4,NOTES.C5],[NOTES.F4,NOTES.A4,NOTES.C5,NOTES.F5],
                      [NOTES.G4,NOTES.B4,NOTES.D5,NOTES.G5],[NOTES.C4,NOTES.E4,NOTES.G4,NOTES.C5]];
        playPadChord(chords[Math.floor(step / 4) % 4], time, beatDuration * 3.5, 0.15);
      }
      playPianoNote(melody[step % 16], time, beatDuration * 1.5, 0.25);
      step++;
      currentBgmNodes.push(setTimeout(playStep, beatDuration * 1000));
    }
    playStep();
  }

  function startEndingBadBgm() {
    var bpm = 55, beatDuration = 60 / bpm, step = 0;
    function playStep() {
      if (!currentBgm || currentBgm !== 'ending_bad') return;
      var time = audioContext.currentTime;
      var melody = [NOTES.E5, NOTES.D5, NOTES.C5, NOTES.B4, NOTES.A4, NOTES.G4, NOTES.F4, NOTES.E4,
                    NOTES.D4, NOTES.C4, NOTES.B3, NOTES.A3, NOTES.G3, NOTES.F3, NOTES.E3, NOTES.D3];
      if (step % 4 === 0) {
        var chords = [[NOTES.A3,NOTES.C4,NOTES.E4],[NOTES.F3,NOTES.A3,NOTES.C4],[NOTES.E3,NOTES.G3,NOTES.B3],[NOTES.D3,NOTES.F3,NOTES.A3]];
        playPadChord(chords[Math.floor(step / 4) % 4], time, beatDuration * 3.5, 0.1);
      }
      playPianoNote(melody[step % 16], time, beatDuration * 2, 0.2);
      step++;
      currentBgmNodes.push(setTimeout(playStep, beatDuration * 1000));
    }
    playStep();
  }

  // ===== UI 音效 =====
  function soundClick() {
    playEnvelopeTone(800, 0.1, 0.005, 0.02, 0.3, 0.05, 'sine', 0.25);
    playEnvelopeTone(1200, 0.08, 0.005, 0.015, 0.2, 0.03, 'sine', 0.15);
  }
  function soundUnlock() {
    var notes = [NOTES.C5, NOTES.E5, NOTES.G5, NOTES.C6];
    notes.forEach(function(note, i) { setTimeout(function() { playEnvelopeTone(note, 0.3, 0.01, 0.05, 0.5, 0.1, 'sine', 0.3); }, i * 100); });
  }
  function soundAffectionUp() {
    playEnvelopeTone(NOTES.E5, 0.25, 0.01, 0.03, 0.4, 0.1, 'sine', 0.25);
    setTimeout(function() { playEnvelopeTone(NOTES.G5, 0.3, 0.01, 0.03, 0.5, 0.15, 'sine', 0.2); }, 80);
  }
  function soundAffectionDown() {
    playEnvelopeTone(NOTES.G4, 0.3, 0.01, 0.05, 0.3, 0.1, 'triangle', 0.2);
    setTimeout(function() { playEnvelopeTone(NOTES.E4, 0.35, 0.01, 0.05, 0.3, 0.15, 'triangle', 0.15); }, 100);
  }
  function soundSleep() {
    if (!audioContext || isMuted) return;
    var time = audioContext.currentTime;
    var osc = audioContext.createOscillator();
    var gain = audioContext.createGain();
    var filter = audioContext.createBiquadFilter();
    osc.type = 'sine'; osc.frequency.setValueAtTime(NOTES.C5, time); osc.frequency.exponentialRampToValueAtTime(NOTES.C3, time + 1.5);
    filter.type = 'lowpass'; filter.frequency.value = 1000;
    gain.gain.setValueAtTime(0.2, time); gain.gain.exponentialRampToValueAtTime(0.001, time + 1.5);
    osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
    osc.start(time); osc.stop(time + 1.6);
  }
  function soundDayStart() {
    var notes = [NOTES.C5, NOTES.E5, NOTES.G5, NOTES.C6, NOTES.E6];
    notes.forEach(function(note, i) { setTimeout(function() {
      if (!audioContext || isMuted) return;
      var osc = audioContext.createOscillator(); var gain = audioContext.createGain();
      osc.type = 'sine'; osc.frequency.value = note;
      var now = audioContext.currentTime;
      gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.2, now + 0.01); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.connect(gain); gain.connect(masterGain); osc.start(now); osc.stop(now + 0.85);
    }, i * 120); });
  }

  var bgmStarters = {
    menu: startMenuBgm, daily: startDailyBgm, romantic: startRomanticBgm,
    tense: startTenseBgm, ending_good: startEndingGoodBgm, ending_bad: startEndingBadBgm
  };
  var sounds = {
    click: soundClick, unlock: soundUnlock, affection_up: soundAffectionUp,
    affection_down: soundAffectionDown, sleep: soundSleep, day_start: soundDayStart
  };

  return {
    init: function() {
      if (isInitialized) return;
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.5;
        masterGain.connect(audioContext.destination);
        isInitialized = true;
        console.log('BloomAudio initialized');
      } catch(e) { console.warn('AudioContext not supported'); }
    },
    playBgm: function(scene) {
      if (!isInitialized || isMuted) return;
      this.stopBgm();
      currentBgm = scene;
      if (bgmStarters[scene]) bgmStarters[scene]();
    },
    stopBgm: function() {
      currentBgmNodes.forEach(function(t) { clearTimeout(t); });
      currentBgmNodes = [];
      if (masterGain && audioContext) {
        var now = audioContext.currentTime;
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(isMuted ? 0 : 0.5, now + fadeTime);
      }
      currentBgm = null;
    },
    playSound: function(name) {
      if (!isInitialized || isMuted) return;
      if (sounds[name]) sounds[name]();
    },
    setVolume: function(vol) { if (masterGain) masterGain.gain.value = Math.max(0, Math.min(1, vol)); },
    getCurrentBgm: function() { return currentBgm; },
    isReady: function() { return isInitialized; },
    toggleMute: function() {
      isMuted = !isMuted;
      var btn = document.getElementById('bgm-toggle');
      if (btn) btn.textContent = isMuted ? '🔇 静音' : '🎵 BGM';
      if (isMuted) { this.stopBgm(); } else { var bgm = currentBgm; currentBgm = null; if (bgm) this.playBgm(bgm); }
    }
  };
})();

// ===== 游戏状态 =====
class GameState {
    constructor() { this.reset(); }

    reset() {
        this.day = 1;
        this.actionPoints = 3;
        this.maxActionPoints = 3;
        this.playerName = '';
        this.playerMBTI = '';
        this.chosenFirst = '';
        this.dailyEncounter = true;
        this.achievements = [];
        this.triggeredScenes = [];
        this.confessionWindow = {};
        this.cohabiting = {};
        this.divorced = {};
        this.gameEnded = false;
        this.dailyContactCount = {}; // 兼容保留
        this.activityProgress = {};  // {activityId: n} 每个活动推进到第几步
        this.dailyUsedActivities = []; // 今天已用过的活动id

        Object.keys(CHARACTERS).forEach(k => {
            const c = CHARACTERS[k];
            c.affection = 0;
            c.relation = 'stranger';
            c.unlocked = false;
            c.sceneIndex = {}; // 记录每个角色当前推进到第几个场景
            c.lastContactDay = 0; // 上次联系日（0=从未联系）
        });
    }

    save() {
        const data = {
            day: this.day, actionPoints: this.actionPoints,
            playerName: this.playerName, playerMBTI: this.playerMBTI,
            chosenFirst: this.chosenFirst, dailyEncounter: this.dailyEncounter,
            achievements: this.achievements, triggeredScenes: this.triggeredScenes,
            confessionWindow: this.confessionWindow, cohabiting: this.cohabiting,
            divorced: this.divorced, gameEnded: this.gameEnded,
            dailyContactCount: this.dailyContactCount,
            activityProgress: this.activityProgress || {},
            dailyUsedActivities: this.dailyUsedActivities || [],
            characters: Object.keys(CHARACTERS).reduce((a, k) => {
                a[k] = { affection: CHARACTERS[k].affection, relation: CHARACTERS[k].relation, unlocked: CHARACTERS[k].unlocked, sceneIndex: CHARACTERS[k].sceneIndex || {}, lastContactDay: CHARACTERS[k].lastContactDay || 0 };
                return a;
            }, {})
        };
        localStorage.setItem('bloom60_save', JSON.stringify(data));
    }

    load() {
        const d = localStorage.getItem('bloom60_save');
        if (!d) return false;
        const data = JSON.parse(d);
        this.day = data.day; this.actionPoints = data.actionPoints;
        this.playerName = data.playerName; this.playerMBTI = data.playerMBTI;
        this.chosenFirst = data.chosenFirst; this.dailyEncounter = data.dailyEncounter;
        this.achievements = data.achievements || [];
        this.triggeredScenes = data.triggeredScenes || [];
        this.confessionWindow = data.confessionWindow || {};
        this.cohabiting = data.cohabiting || {};
        this.divorced = data.divorced || {};
        this.gameEnded = data.gameEnded || false;
        this.dailyContactCount = data.dailyContactCount || {};
        this.activityProgress = data.activityProgress || {};
        this.dailyUsedActivities = data.dailyUsedActivities || [];
        if (data.characters) {
            Object.keys(data.characters).forEach(k => {
                if (CHARACTERS[k]) {
                    CHARACTERS[k].affection = data.characters[k].affection;
                    CHARACTERS[k].relation = data.characters[k].relation;
                    CHARACTERS[k].unlocked = data.characters[k].unlocked;
                    CHARACTERS[k].sceneIndex = data.characters[k].sceneIndex || {};
                    CHARACTERS[k].lastContactDay = data.characters[k].lastContactDay || 0;
                }
            });
        }
        return true;
    }

    hasSave() { return !!localStorage.getItem('bloom60_save'); }

    isSceneTriggered(charId, sceneId) {
        return this.triggeredScenes.includes(`${charId}_${sceneId}`);
    }

    markSceneTriggered(charId, sceneId) {
        const key = `${charId}_${sceneId}`;
        if (!this.triggeredScenes.includes(key)) this.triggeredScenes.push(key);
    }
}

// ===== 核心游戏引擎 =====
class GameEngine {
    constructor() { this.init(); }

    init() {
        document.getElementById('btn-continue').disabled = !gameState.hasSave();
        this.mbtiAnswers = {};
        this.renderMbtiTest();
        this.renderMbtiGrid();
    }

    // ===== 页面导航 =====
    showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'review-page') this.renderReview();
    }

    // ===== 首页 =====
    startNewGame() {
        if (confirm('开始新游戏？当前进度将丢失。')) {
            gameState.reset();
            this.showPage('create-page');
        }
    }

    continueGame() {
        if (gameState.load()) {
            this.showPage('game-page');
            this.updateUI();
            toast('📖 继续游戏');
        }
    }

    // ===== 角色创建 =====
    renderMbtiTest() {
        const container = document.getElementById('mbti-test');
        container.innerHTML = MBTI_QUESTIONS.map((q, qi) => `
            <div class="mbti-question" id="mbti-q-${qi}">
                <div class="mbti-q-num">Q${qi + 1} / ${MBTI_QUESTIONS.length}</div>
                <div class="mbti-q-text">${q.q}</div>
                ${q.opts.map((o, oi) => `
                    <button class="mbti-opt" data-q="${qi}" data-score="${o.score}" onclick="game.selectMbtiOpt(this, ${qi}, '${o.score}')">${o.text}</button>
                `).join('')}
            </div>
        `).join('');
    }

    selectMbtiOpt(btn, qi, score) {
        const qBtns = document.querySelectorAll(`[data-q="${qi}"]`);
        qBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        this.mbtiAnswers[qi] = score;
        // 自动滚动到下一题
        const nextQ = document.getElementById(`mbti-q-${qi + 1}`);
        if (nextQ) nextQ.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    calcMbtiResult() {
        if (Object.keys(this.mbtiAnswers).length < MBTI_QUESTIONS.length) {
            toast('请回答所有题目~');
            return;
        }
        const counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        Object.values(this.mbtiAnswers).forEach(s => counts[s]++);
        const type = (counts.E >= counts.I ? 'E' : 'I') +
                     (counts.S >= counts.N ? 'S' : 'N') +
                     (counts.T >= counts.F ? 'T' : 'F') +
                     (counts.J >= counts.P ? 'J' : 'P');
        this.showMbtiResult(type);
    }

    showMbtiResult(type) {
        gameState.playerMBTI = type;
        document.getElementById('mbti-test').style.display = 'none';
        document.querySelector('#create-page .mbti-test').nextElementSibling.style.display = 'none';
        document.getElementById('mbti-result').style.display = 'block';
        document.getElementById('mbti-result-type').textContent = type;
        document.getElementById('mbti-result-name').textContent = MBTI_NAMES[type] || '';
        document.getElementById('mbti-result-desc').textContent = MBTI_DESCS[type] || '';
        document.getElementById('btn-start-from-name').style.display = 'block';
    }

    resetMbti() {
        this.mbtiAnswers = {};
        gameState.playerMBTI = '';
        document.getElementById('mbti-test').style.display = 'block';
        document.querySelector('#create-page .mbti-test').nextElementSibling.style.display = 'flex';
        document.getElementById('mbti-result').style.display = 'none';
        document.querySelectorAll('.mbti-opt').forEach(b => b.classList.remove('selected'));
        this.renderMbtiTest();
    }

    showMbtiGrid() {
        this.resetMbti();
        document.getElementById('mbti-select-section').style.display = 'block';
        document.getElementById('btn-start-from-name').style.display = 'none';
    }

    renderMbtiGrid() {
        const grid = document.getElementById('mbti-grid');
        const types = Object.keys(MBTI_NAMES);
        grid.innerHTML = types.map(t => `
            <div class="mbti-card" data-mbti="${t}" onclick="game.selectMbtiCard('${t}')">
                <div class="mbti-type">${t}</div>
                <div>${MBTI_NAMES[t]}</div>
            </div>
        `).join('');
    }

    selectMbtiCard(type) {
        document.querySelectorAll('.mbti-card').forEach(c => c.classList.remove('selected'));
        document.querySelector(`[data-mbti="${type}"]`).classList.add('selected');
        gameState.playerMBTI = type;
    }

    // ===== 开始游戏 =====
    startGame() {
        const name = document.getElementById('input-name').value.trim();
        if (!name) { toast('请输入你的名字~'); return; }
        if (!gameState.playerMBTI) { toast('请选择或测试你的MBTI~'); return; }

        // 初始化BGM音频系统（需用户交互后调用）
        BloomAudio.init();
        document.getElementById('bgm-toggle').style.display = 'block';

        gameState.playerName = name;
        // 所有角色初始好感0，未解锁
        Object.keys(CHARACTERS).forEach(k => {
            CHARACTERS[k].affection = 0;
            CHARACTERS[k].unlocked = false;
        });
        document.getElementById('bottom-nav').style.display = 'flex';
        this.showPage('game-page');
        BloomAudio.playBgm('daily');
        BloomAudio.playSound('day_start');
        this.updateUI();
        // 第一天提示
        setTimeout(() => {
            toast(`欢迎来到上海，${gameState.playerName}！\n选择你今天要做的事`);
        }, 500);
    }

    // ===== 主UI更新 =====
    updateUI() {
        // 顶部状态栏
        document.getElementById('day-num').textContent = gameState.day;
        const theme = SPECIAL_DAYS[gameState.day] || '';
        document.getElementById('day-theme-label').textContent = theme;
        document.getElementById('day-theme-text').textContent = theme ? `✨ ${theme}` : '';

        // 行动点
        const apContainer = document.getElementById('action-points');
        apContainer.innerHTML = '';
        for (let i = 0; i < gameState.maxActionPoints; i++) {
            const dot = document.createElement('div');
            dot.className = 'action-dot ' + (i < gameState.actionPoints ? 'available' : 'used');
            apContainer.appendChild(dot);
        }

        // 剩余行动点提示
        const remainEl = document.getElementById('action-remain');
        if (remainEl) {
            remainEl.textContent = gameState.actionPoints > 0
                ? `还有 ${gameState.actionPoints} 次行动`
                : '今天做够了，好好休息吧';
        }

        // 已解锁角色快捷栏
        const knownBar = document.getElementById('chars-known-bar');
        const unlocked = Object.keys(CHARACTERS).filter(k => CHARACTERS[k].unlocked && !gameState.divorced[k]);
        if (unlocked.length > 0) {
            knownBar.style.display = 'block';
            this.renderCharsMini();
        } else {
            knownBar.style.display = 'none';
        }

        // 活动网格
        this.renderActivityGrid();

        // 每日提示
        document.getElementById('daily-tip').textContent = this.getDailyTip();
    }

    // ===== 渲染活动网格 =====
    renderActivityGrid() {
        const grid = document.getElementById('activity-grid');
        const day = gameState.day;

        const ACTIVITY_DEFS = [
            { id: 'stay_home', icon: '🏠', name: '在家宅着',     hint: '宅着休息' },
            { id: 'gym',       icon: '🏋️', name: '去健身房',    hint: '运动健身' },
            { id: 'park',      icon: '🌿', name: '去公园散步',   hint: '放空一下' },
            { id: 'dinner',    icon: '🍷', name: '和朋友吃饭',   hint: '享受美食' },
            { id: 'overtime',  icon: '💼', name: '在公司加班',   hint: '拼一把' },
            { id: 'cafe',      icon: '☕', name: '咖啡馆工作',   hint: '换个环境' }
        ];

        grid.innerHTML = ACTIVITY_DEFS.map(act => {
            const usedToday = (gameState.dailyUsedActivities || []).includes(act.id);
            const isNoAP = gameState.actionPoints <= 0;
            const isDisabled = usedToday || isNoAP;

            // 该活动对应角色
            const actToChar = { stay_home:'wenya', gym:'xiayang', park:'sujingyi', dinner:'luxiao', overtime:'linwanqing', cafe:null };
            const charId = actToChar[act.id];
            const charUnlocked = charId && CHARACTERS[charId] && CHARACTERS[charId].unlocked;

            let hintText = act.hint;
            if (usedToday) hintText = '今天已做过';
            else if (isNoAP) hintText = '行动点耗尽';

            return `<button class="activity-btn ${isDisabled ? 'used' : ''} ${charUnlocked && !isDisabled ? 'unlocked-glow' : ''}"
                onclick="${isDisabled ? '' : `game.doActivity('${act.id}')`}">
                ${charUnlocked ? `<span class="activity-known">${CHARACTERS[charId].avatar}</span>` : ''}
                ${usedToday ? `<span class="activity-count">✓</span>` : ''}
                <span class="activity-icon">${act.icon}</span>
                <span class="activity-name">${act.name}</span>
                <span class="activity-hint">${hintText}</span>
            </button>`;
        }).join('');
    }

    renderCharsMini() {
        const grid = document.getElementById('chars-grid');
        if (!grid) return;
        const unlocked = Object.keys(CHARACTERS).filter(k => CHARACTERS[k].unlocked && !gameState.divorced[k]);
        grid.innerHTML = unlocked.map(k => {
            const c = CHARACTERS[k];
            const pct = Math.max(0, Math.min(100, c.affection));
            const isLover = ['lover','hotlove','cohabiting','engaged','married'].includes(c.relation);
            return `
                <div class="char-mini ${isLover ? 'glow' : ''}"
                     onclick="game.showCharDetail('${k}')"
                     title="${c.name} · ${c.affection}好感">
                    <div class="char-mini-icon">${c.avatar}</div>
                    <div class="char-mini-name">${c.name}</div>
                    <div class="char-mini-bar">
                        <div class="char-mini-fill" style="width:${pct}%;background:${c.color}"></div>
                    </div>
                    ${isLover ? '<div class="char-badge">❤</div>' : ''}
                </div>
            `;
        }).join('');
    }

    showCharDetail(id) {
        const c = CHARACTERS[id];
        if (!c || !c.unlocked) return;
        const canContact = gameState.actionPoints > 0;
        const affText = c.affection >= 86 ? '恋人关系 ❤' :
                        c.affection >= 66 ? '暧昧中 💕' :
                        c.affection >= 41 ? '熟悉的朋友 😊' :
                        c.affection >= 21 ? '认识的人 👋' : '刚认识 😶';

        // 好感度≥21才能主动联系；≥41才能打电话；≥60才能约出来
        const canMsg   = canContact && c.affection >= 21;
        const canCall  = canContact && c.affection >= 41;
        const canDate  = canContact && c.affection >= 60;

        const infoText = `${c.name}  ${c.mbti}\n${c.age}岁 · ${c.job}\n\n当前好感：${c.affection} · ${affText}`;

        const choices = [];
        if (canMsg)  choices.push({ text: '💬 发消息', affection: 0, _action: () => this.triggerScene(id, 'msg') });
        if (canCall) choices.push({ text: '📞 打电话', affection: 0, _action: () => this.triggerScene(id, 'call') });
        if (canDate) choices.push({ text: '💕 约出来', affection: 0, _action: () => this.triggerScene(id, 'date') });
        if (choices.length === 0) {
            choices.push({ text: c.affection < 21 ? `（好感度≥21才能主动联系）` : '关闭', affection: 0 });
        }
        choices.push({ text: '关闭', affection: 0 });

        this.showDialogue(c, infoText, choices);
    }

    // ===== 活动故事序列数据 =====
    // 每个活动有若干节点，按「该活动被执行的第几次」依次推进
    // 每天每个活动限用1次；每次推进一个节点
    getActivityStory(activityId) {
        const name = gameState.playerName || '你';
        const stories = (typeof ACTIVITY_STORIES !== 'undefined') ? ACTIVITY_STORIES : null;
        if (!stories || !stories[activityId]) return [];
        return stories[activityId];
    }

    // ===== 活动系统（核心入口）=====
    doActivity(activityId) {
        if (gameState.actionPoints <= 0) {
            toast('今天的行动力耗尽了，好好休息吧');
            return;
        }
        if (!gameState.dailyUsedActivities) gameState.dailyUsedActivities = [];
        if (gameState.dailyUsedActivities.includes(activityId)) {
            toast('今天已经做过这件事了，明天再来');
            return;
        }

        const story = this.getActivityStory(activityId);
        if (!story || story.length === 0) {
            toast('这个活动暂时没有内容');
            return;
        }

        // 获取该活动的推进次数
        if (!gameState.activityProgress) gameState.activityProgress = {};
        const progress = gameState.activityProgress[activityId] || 0;
        // 取当前节点，超出则取最后一个
        const node = story[Math.min(progress, story.length - 1)];

        // 消耗行动点，标记今天已用
        gameState.actionPoints--;
        gameState.dailyUsedActivities.push(activityId);

        // 推进进度（只有当节点不是"最后一个循环节点"时才推进）
        if (progress < story.length - 1) {
            gameState.activityProgress[activityId] = progress + 1;
        }

        // 处理咖啡馆第2次+：随机遇见已认识的人
        if (activityId === 'cafe' && node.charId === '_random_known') {
            const knownChars = Object.keys(CHARACTERS).filter(k => CHARACTERS[k].unlocked && !gameState.divorced[k]);
            if (knownChars.length > 0) {
                const charId = knownChars[Math.floor(Math.random() * knownChars.length)];
                const c = CHARACTERS[charId];
                c.lastContactDay = gameState.day;
                const cafeTexts = [
                    `咖啡馆里，你正在工作，突然听到有人叫你名字。\n\n${c.name}站在旁边，手里端着咖啡，有些意外的样子。\n\n${c.name}：「你也在这？真巧。」`,
                    `你低头看手机，${c.name}把咖啡杯放到你桌对面，直接坐下来：\n\n${c.name}：「这里坐，可以吗？」`,
                    `窗边的位置，${c.name}比你早到。\n\n她看到你，向你招了招手。`,
                ];
                const text = cafeTexts[Math.floor(Math.random() * cafeTexts.length)];
                const triggered = this.tryTriggerScene(charId);
                if (!triggered) {
                    this.showReturnDialogue(c, text);
                }
                this.updateUI();
                return;
            } else {
                toast('你在咖啡馆工作了一下午，效率不错。');
                this.updateUI();
                return;
            }
        }

        // 确定本节点操作的角色
        let charId = node.charId;
        // 节点内选项可能有 charId 覆盖（某些选项触发才遇见）
        // 处理选项中的 charId 覆盖：由 handleChoice 处理
        
        // 首次遇见？
        if (charId && charId !== null && !CHARACTERS[charId].unlocked && node.firstMeet) {
            const c = CHARACTERS[charId];
            c.unlocked = true;
            c.affection = 5;
            c.lastContactDay = gameState.day;
            this.showDialogue(c, node.text, node.choices);
            this.updateUI();
            return;
        }

        // 有角色且已认识 → 尝试触发剧情场景，否则用节点文本
        if (charId && CHARACTERS[charId] && CHARACTERS[charId].unlocked) {
            const c = CHARACTERS[charId];
            c.lastContactDay = gameState.day;
            const triggered = this.tryTriggerScene(charId);
            if (!triggered) {
                this.showReturnDialogue(c, node.text);
            }
            this.updateUI();
            return;
        }

        // 无角色或角色未遇见 → 纯主角视角文本（选项可能触发遇见）
        const pseudoChar = {
            id: '__narrator__',
            name: '今天',
            avatar: '📖',
            mbti: '',
            color: '#aaa'
        };

        // 处理选项中带 charId 的（遇见触发）和 _nextMeet
        const resolvedChoices = (node.choices || []).map(ch => ({
            ...ch,
            _activityId: activityId
        }));

        this._pendingActivityNode = node;
        this.showDialogue(pseudoChar, node.text, resolvedChoices);
        this.updateUI();
    }

    // ===== 首次遇见对话（单独调用） =====
    showFirstMeetDialogue(c, text) {
        const choices = [
            { text: `「你好，我是${gameState.playerName}，刚搬来上海。」`, affection: 5 },
            { text: `「……（微笑点头）」`, affection: 3 },
            { text: `「（礼貌地打招呼，没多说什么）」`, affection: 2 }
        ];
        this.showDialogue(c, text, choices);
    }

    // ===== 再次相遇对话 =====
    showReturnDialogue(c, text) {
        const baseChoices = [
            { text: '「……（认真倾听）」', affection: 3 },
            { text: '「哈哈，真的吗。」', affection: 1 },
        ];
        if (c.affection >= 30) {
            baseChoices.unshift({ text: '「我也这么觉得！」', affection: 4 });
        }
        if (c.affection >= 50) {
            baseChoices.push({ text: '「以后可以多聊聊。」', affection: 5 });
        }
        this.showDialogue(c, text, baseChoices);
    }

    // ===== 尝试触发剧情场景 =====
    tryTriggerScene(charId) {
        const scenes = this.getScenes(charId);
        if (!scenes) return false;
        const c = CHARACTERS[charId];

        // 找下一个未触发、满足好感条件的场景
        const nextScene = scenes.find(s => {
            if (gameState.isSceneTriggered(charId, s.id)) return false;
            if (s.trigger === `unlock_${charId}`) return false; // 首次遇见场景已处理
            // 检查好感度条件
            if (s.minAffection && c.affection < s.minAffection) return false;
            // 普通场景
            if (s.trigger && s.trigger.startsWith('scene_')) return true;
            if (s.trigger === `msg_${charId}`) return true;
            if (s.trigger === `call_${charId}`) return c.affection >= 40;
            if (s.trigger === `date_${charId}`) return c.affection >= 60;
            return false;
        });

        if (nextScene) {
            this.showScene(charId, nextScene);
            return true;
        }
        return false;
    }

    // ===== 直接联系已认识的人（从角色详情页调用）=====
    triggerScene(charId, type) {
        const c = CHARACTERS[charId];
        if (!c || !c.unlocked) return;
        if (gameState.divorced[charId]) { toast(`${c.name} 已与你断绝关系`); return; }
        if (gameState.actionPoints <= 0) { toast('行动点不足，今天没有精力了'); return; }

        // 消耗行动点 + 更新联系时间
        gameState.actionPoints = Math.max(0, gameState.actionPoints - 1);
        c.lastContactDay = gameState.day;

        // 找到未触发的场景
        const scenes = this.getScenes(charId);
        const nextScene = scenes ? scenes.find(s => {
            if (gameState.isSceneTriggered(charId, s.id)) return false;
            if (s.trigger === `unlock_${charId}`) return false;
            if (s.trigger === `msg_${charId}`) return type === 'msg';
            if (s.trigger === `call_${charId}`) return type === 'call';
            if (s.trigger === `date_${charId}`) return type === 'date';
            if (s.trigger && s.trigger.startsWith('scene_')) return true;
            return false;
        }) : null;

        if (nextScene) {
            this.showScene(charId, nextScene);
        } else {
            const genericTexts = this.getGenericText(charId, type);
            this.showDialogue(c, genericTexts.text, genericTexts.choices);
        }
        this.updateUI();
    }

    getScenes(charId) {
        const maps = {
            wenya: window.WENYA_SCENES, xiayang: window.XIAYANG_SCENES,
            sujingyi: window.SUJINGYI_SCENES, luxiao: window.LUXIAO_SCENES,
            linwanqing: window.LINWANQING_SCENES
        };
        return maps[charId] || null;
    }

    getGenericText(charId, type) {
        const c = CHARACTERS[charId];
        const baseTexts = {
            msg: {
                text: `${c.name}给你发了消息：\n\n「在吗？」`,
                choices: [
                    { text: '「在呢~」', affection: 3 },
                    { text: '「有什么事？」', affection: 1 },
                    { text: '「在想你。」', affection: 5 },
                    { text: '「忙，迟点聊。」', affection: -2 }
                ]
            },
            call: {
                text: `你拨通了${c.name}的电话。\n\n${c.name}：「喂？」`,
                choices: [
                    { text: '「想听听你的声音。」', affection: 5 },
                    { text: '「最近怎么样？」', affection: 3 },
                    { text: '「没什么事，就想聊聊。」', affection: 3 },
                    { text: '「打扰了，挂了吧。」', affection: -3 }
                ]
            },
            date: {
                text: `${c.name}提议：\n\n「这周末有空吗？想约你出来。」`,
                choices: [
                    { text: '「好呀，去哪？」', affection: 5 },
                    { text: '「可以，几点？」', affection: 4 },
                    { text: '「我看看日程。」', affection: 1 },
                    { text: '「这周比较忙。」', affection: -3 }
                ]
            }
        };
        return baseTexts[type] || baseTexts.msg;
    }

    showScene(charId, scene) {
        const c = CHARACTERS[charId];
        gameState.markSceneTriggered(charId, scene.id);
        this.showDialogue(c, scene.text, scene.choices);
    }

    // ===== 对话系统 =====
    showDialogue(char, text, choices, closeable = true) {
        // 根据角色切换BGM（如果当前BGM不是该角色的则切换）
        if (BloomAudio.isReady() && char.id && char.id !== '__narrator__') {
            var charBgmMap = { wenya: 'daily', xiayang: 'daily', sujingyi: 'daily', luxiao: 'romantic', linwanqing: 'daily' };
            var targetBgm = charBgmMap[char.id] || 'daily';
            if (char.affection >= 41) targetBgm = 'romantic';
            if (BloomAudio.getCurrentBgm() !== targetBgm) {
                BloomAudio.playBgm(targetBgm);
            }
        }

        document.getElementById('dlg-avatar').textContent = char.avatar;
        document.getElementById('dlg-char-name').textContent = char.name;
        document.getElementById('dlg-char-mbti').textContent = `${char.mbti} · ${MBTI_NAMES[char.mbti] || ''}`;
        document.getElementById('dlg-text').textContent = text;

        const playerMBTI = gameState.playerMBTI;
        // MBTI过滤：只显示玩家MBTI倾向的选项（随机选2个，避免选项过多）
        const filtered = choices.filter(ch => !ch.mbtiHide || !ch.mbtiHide.includes(playerMBTI));
        const toShow = filtered.length <= 3 ? filtered :
            filtered.sort(() => Math.random() - 0.5).slice(0, 3);

        document.getElementById('dlg-choices').innerHTML = toShow.map((ch, i) => `
            <button class="dialogue-choice" onclick="game.handleChoice(${i}, ${JSON.stringify(ch).replace(/"/g, '&quot;')})">${ch.text}</button>
        `).join('');

        document.getElementById('dlg-close').style.display = closeable ? 'block' : 'none';
        document.getElementById('dialogue-overlay').classList.add('active');
        this._currentChoices = toShow;
        this._currentCharId = char.id;
        this._choiceData = choices;
    }

    handleChoice(index, rawChoice) {
        const choice = this._choiceData.find(c => c.text === rawChoice.text) || rawChoice;
        const charId = this._currentCharId;
        const c = charId !== '__narrator__' ? CHARACTERS[charId] : null;

        // 支持_action回调（来自showCharDetail）
        if (choice._action) {
            this.closeDialogue();
            choice._action();
            return;
        }

        // 活动节点选项中的 charId 覆盖：此选项直接遇见某角色
        if (choice.charId && choice.charId !== '__narrator__') {
            const overrideChar = CHARACTERS[choice.charId];
            if (overrideChar && overrideChar.unlocked) {
                // 已认识，触发互动
                overrideChar.lastContactDay = gameState.day;
                const triggered = this.tryTriggerScene(choice.charId);
                if (!triggered) {
                    this.closeDialogue();
                    const text = `${overrideChar.name}在门口等着你。\n\n${overrideChar.name}：「来了？」`;
                    this.showReturnDialogue(overrideChar, text);
                } else {
                    this.closeDialogue();
                }
                this.updateUI();
                return;
            }
        }

        // 计算好感度变化（含MBTI加成）
        let affectionDelta = choice.affection || 0;
        if (c && affectionDelta !== 0) {
            const bonus = this.calcMbtiBonus(charId, choice);
            affectionDelta += bonus;
            this.changeAffection(charId, affectionDelta);
        }

        // 处理next跳转
        if (choice.next) {
            if (choice.next === 'start') {
                this.closeDialogue();
                this.updateUI();
                return;
            }
            const scenes = charId !== '__narrator__' ? this.getScenes(charId) : null;
            const next = scenes ? scenes.find(s => s.id === choice.next) : null;
            if (next) {
                this.showScene(charId, next);
                return;
            }
        }

        // 处理结局
        if (choice.ending) {
            this.closeDialogue();
            this.showEnding(charId, choice.ending);
            return;
        }

        this.closeDialogue();
        this.updateUI();
    }

    calcMbtiBonus(charId, choice) {
        const playerMBTI = gameState.playerMBTI;
        const char = CHARACTERS[charId];
        let bonus = 0;
        // 攻略角色MBTI加成
        if (choice.charMbtiBonus && choice.charMbtiBonus[char.mbti]) {
            const charBonus = choice.charMbtiBonus[char.mbti][playerMBTI] ||
                              choice.charMbtiBonus[char.mbti].default || 0;
            bonus += charBonus;
        }
        // 玩家MBTI通用加成
        if (choice.mbtiBonus && choice.mbtiBonus[playerMBTI]) {
            bonus += choice.mbtiBonus[playerMBTI];
        }
        // 自然吸引加成（玩家MBTI在角色attract列表内）
        if (char.attractMbti && char.attractMbti.includes(playerMBTI) && bonus >= 0) {
            bonus += 2;
        }
        // 自然排斥（玩家MBTI在角色repel列表内）
        if (char.repelMbti && char.repelMbti.includes(playerMBTI) && bonus > 0) {
            bonus -= 2;
        }
        return bonus;
    }

    closeDialogue() {
        document.getElementById('dialogue-overlay').classList.remove('active');
    }

    // ===== 好感度变化 =====
    changeAffection(charId, amount) {
        const c = CHARACTERS[charId];
        if (!c || gameState.divorced[charId]) return;
        const old = c.affection;
        c.affection = Math.max(0, Math.min(120, c.affection + amount));
        const newR = this.getRelation(c.affection);

        // 好感度变化音效
        if (amount > 0) BloomAudio.playSound('affection_up');
        else if (amount < 0) BloomAudio.playSound('affection_down');

        if (newR !== c.relation) {
            c.relation = newR;
            if (amount > 0) toast(`${c.name} 关系升级：${RELATION_STAGES[newR]}`);
            if (newR === 'lover' || newR === 'hotlove') {
                this.showAchievement(`【${c.name}·恋人】`);
                BloomAudio.playBgm('romantic');
            }
            if (newR === 'cohabiting') this.showAchievement(`【${c.name}·同居】`);
            if (newR === 'married') this.showAchievement(`【${c.name}·结婚】`);
        }

        // 解锁检查
        if (old < 20 && c.affection >= 20 && !c.unlocked) {
            c.unlocked = true;
            BloomAudio.playSound('unlock');
            toast(`🎉 ${c.name} 解锁了！可以主动联系了`);
        }

        // 告白窗口检查（好感≥86）
        if (c.affection >= 86 && !gameState.confessionWindow[charId] && c.relation !== 'lover') {
            gameState.confessionWindow[charId] = 3;
            toast(`💕 ${c.name} 似乎在等你的答复...`);
        }
    }

    getRelation(affection) {
        if (affection >= 120) return 'married';
        if (affection >= 100) return 'engaged';
        if (affection >= 86) return 'cohabiting';
        if (affection >= 76) return 'hotlove';
        if (affection >= 60) return 'lover';
        if (affection >= 40) return 'ambiguous';
        if (affection >= 20) return 'friend';
        return 'stranger';
    }

    // ===== 回顾关系 =====
    renderReview() {
        const cards = document.getElementById('review-cards');
        cards.innerHTML = Object.keys(CHARACTERS).map(k => {
            const c = CHARACTERS[k];
            const pct = Math.max(0, Math.min(100, c.affection));
            const stage = this.getRelation(c.affection);
            const isDivorced = gameState.divorced[k];
            const triggeredCount = gameState.triggeredScenes.filter(s => s.startsWith(`${k}_`)).length;
            return `
                <div class="review-card">
                    <div class="review-card-header">
                        <div class="review-avatar" style="background:${c.color}">${c.avatar}</div>
                        <div>
                            <div class="review-name">${c.name} ${isDivorced ? '❌' : ''}</div>
                            <div class="review-stage">${isDivorced ? '已断联' : RELATION_STAGES[stage] || '陌生人'}</div>
                        </div>
                    </div>
                    <div class="review-bar-wrap">
                        <div class="review-bar" style="width:${pct}%;background:${c.color}"></div>
                    </div>
                    <div class="review-num">
                        <span>好感度 ${c.affection}</span>
                        <span>已触发 ${triggeredCount} 个场景</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    showReview() {
        this.renderReview();
        this.showPage('review-page');
    }

    // ===== 睡觉/下一天 =====
    sleep() {
        BloomAudio.playSound('sleep');
        if (gameState.day >= 60) {
            this.showFinalEnding();
            return;
        }
        gameState.day++;
        gameState.actionPoints = gameState.maxActionPoints;
        gameState.dailyEncounter = true;
        gameState.dailyContactCount = {}; // 兼容旧逻辑
        gameState.dailyUsedActivities = []; // 重置每日活动

        // ===== 好感度递减 =====
        // 认识阶段（0-20）不递减；熟悉/暧昧/恋人阶段递减
        const decayMessages = [];
        Object.keys(CHARACTERS).forEach(k => {
            const c = CHARACTERS[k];
            if (!c.unlocked || gameState.divorced[k]) return;
            // 已触发告白窗口的角色单独处理，不叠加递减
            if (gameState.confessionWindow[k] !== undefined) return;
            // 恋人关系每天联系，不联系才递减（主动联系了会在triggerScene里更新lastContactDay）
            // 递减：熟悉21-40 → -1，暧昧41-85 → -2，恋人86+ → -3
            const daysSince = gameState.day - (c.lastContactDay || 0);
            if (daysSince <= 1) return; // 今天刚联系过，不递减
            // 计算应扣天数（最多回溯3天，避免极端情况）
            const missedDays = Math.min(daysSince - 1, 3);
            let decay = 0;
            if (c.affection >= 86) {
                decay = missedDays * 3; // 恋人每天-3
            } else if (c.affection >= 41) {
                decay = missedDays * 2; // 暧昧每天-2
            } else if (c.affection >= 21) {
                decay = missedDays * 1; // 熟悉每天-1
            }
            // 认识阶段（0-20）不递减
            if (decay > 0) {
                this.changeAffection(k, -decay);
                const charName = c.name;
                decayMessages.push(`${charName} 因为没有联系，好感度下降了`);
            }
        });
        if (decayMessages.length > 0) {
            setTimeout(() => {
                decayMessages.forEach(m => toast(m));
            }, 800);
        }

        // 告白窗口倒计时
        Object.keys(gameState.confessionWindow).forEach(k => {
            gameState.confessionWindow[k]--;
            if (gameState.confessionWindow[k] <= 0) {
                const char = CHARACTERS[k];
                if (char && char.affection < 86) {
                    // 窗口关闭，关系降级
                    this.changeAffection(k, -15);
                    toast(`${char.name} 等不到回应，关系降温了...`);
                }
                delete gameState.confessionWindow[k];
            }
        });

        gameState.save();
        this.updateUI();

        // 检查特殊日
        const specialText = SPECIAL_DAYS[gameState.day];
        if (specialText) {
            toast(`✨ Day ${gameState.day} · ${specialText}`);
        }
    }

    // ===== 每日提示 =====
    getDailyTip() {
        const tips = [
            '💡 偶遇不消耗行动点，每天免费1次',
            '💡 选择选项时，MBTI会影响好感增减',
            '💡 好感度≥20的角色可以主动联系',
            '💡 好感度≥50可以约会对角色',
            '💡 告白窗口开启后记得及时回应',
            '💡 可以在「回顾关系」查看各角色进度',
            '💡 多角色攻略存在风险，请谨慎选择',
            '💡 熟悉后不联系会掉好感，每天要维护'
        ];
        return tips[Math.floor(Math.random() * tips.length)];
    }

    // ===== 结局 =====
    showEnding(charId, endingType) {
        const endingsMap = {
            wenya: window.WENYA_ENDINGS, xiayang: window.XIAYANG_ENDINGS,
            sujingyi: window.SUJINGYI_ENDINGS, luxiao: window.LUXIAO_ENDINGS,
            linwanqing: window.LINWANQING_ENDINGS
        };
        const endings = endingsMap[charId];
        if (!endings || !endings[endingType]) return;
        const ending = endings[endingType];
        if (ending.achievement) this.showAchievement(ending.achievement);
        this.showEndingPage(ending.title, ending.text, ending.achievement || '');
    }

    showEndingPage(title, text, achievement) {
        document.getElementById('ending-icon').textContent = title.includes('HE') || title.includes('在一起') ? '💕' : title.includes('BE') ? '💔' : '🌸';
        document.getElementById('ending-title').textContent = title;
        document.getElementById('ending-text').textContent = text;
        document.getElementById('ending-stat').textContent = achievement ? `🏆 成就：${achievement}` : '';
        gameState.gameEnded = true;
        gameState.save();
        this.showPage('ending-page');
        document.getElementById('status-bar').style.display = 'none';
        document.getElementById('bottom-nav').style.display = 'none';
    }

    showFinalEnding() {
        // 收集各角色最终状态
        const results = Object.keys(CHARACTERS).map(k => ({
            name: CHARACTERS[k].name,
            affection: CHARACTERS[k].affection,
            relation: RELATION_STAGES[this.getRelation(CHARACTERS[k].affection)] || '陌生人'
        })).sort((a, b) => b.affection - a.affection);

        const best = results[0];
        const married = results.filter(r => r.affection >= 100);
        const text = `📅 60天结束\n\n` +
            results.map(r => `${r.name} · ${r.relation}（好感${r.affection}）`).join('\n') +
            `\n\n最佳关系：${best.name}（${best.relation}）`;

        this.showEndingPage(
            married.length > 0 ? `【${married[0].name}·圆满结局】` : '【孤独终老】',
            text.replace('📅 60天结束\n\n', ''),
            ''
        );
    }

    // ===== 成就 =====
    showAchievement(name) {
        const toast_el = document.getElementById('toast');
        toast_el.innerHTML = `🏆 成就解锁<br><strong>${name}</strong>`;
        toast_el.className = 'toast achievement show';
        setTimeout(() => toast_el.className = 'toast', 3000);
        if (!gameState.achievements.includes(name)) gameState.achievements.push(name);
    }

    // ===== 进入游戏主界面 =====
    enterGame() {
        document.getElementById('status-bar').style.display = 'flex';
        document.getElementById('bottom-nav').style.display = 'flex';
        document.getElementById('bgm-toggle').style.display = 'block';
        BloomAudio.init();
        BloomAudio.playBgm('daily');
        this.updateUI();
        this.showPage('game-page');
        gameState.save();
    }

    // ===== 保存 =====
    saveGame() {
        gameState.save();
        toast('✅ 已保存');
    }
}

const game = new GameEngine();

// ===== Toast =====
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show';
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.className = 'toast', 2500);
}
</script>
